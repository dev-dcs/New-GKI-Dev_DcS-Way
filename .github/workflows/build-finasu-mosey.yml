name: Build FinaSU for Pixel 10 (WildKernels + SUSFS + Mosey + Integrity)
run-name: "${{ inputs.kernel_build_version }} | ${{ inputs.gki_lts_version }} | KMI ${{ inputs.kmi_generation }} | ${{ inputs.page_size }} | FinaSU + Mosey"

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_build_version:
        description: "Kernel family = the phone's stock kernel (`uname -r` 6.12.x-android16-... is android16-6.12, 6.6.x-android15-... is android15-6.6). 'all' builds 6.1 / 6.6 / 6.12 in parallel"
        type: choice
        options:
          - android16-6.12
          - android15-6.6
          - android14-6.1
          - all
        default: android16-6.12
      gki_lts_version:
        description: "Sublevel: 'All' builds every released sublevel on the family's KMI generation, 'LTS' just the branch tip, or the last digits of a specific one (e.g. 150)"
        type: string
        default: "All"
      kmi_generation:
        description: "KMI generation of the phone's stock kernel = the number after 'androidNN-' in `uname -r` (6.12.81-android16-6-g... is 6). 'auto' = the one Google's newest release branch is on. A kernel of another generation bootloops."
        type: string
        default: "auto"
      kernel_name:
        description: "Custom kernel name for uname (e.g. Dev_DcS). Letters/digits/._- only. Blank = stock."
        type: string
        default: ""
      page_size:
        description: "ARM64 page size - keep 4k unless your Pixel 10 runs 16KB pages (check: getconf PAGE_SIZE). Wrong value won't boot."
        type: choice
        options:
          - 4k
          - 16k
        default: 4k
      build_variant:
        description: "Pipeline Mode (standalone multi-version matrix or hook into WildKernels fork actions)"
        type: choice
        options:
          - standalone-matrix
          - wildkernels-fork-pipeline
        default: standalone-matrix
      root_variant:
        description: "Root solution to build in. FinaSU is the vendored default; the rest are cloned from upstream. NoRoot = GKI+SUSFS with no manager. 'All' builds FinaSU + the 5 KernelSU-family variants in parallel (NoRoot only when picked on its own)."
        type: choice
        options:
          - FinaSU
          - KernelSU-Next
          - KernelSU
          - SukiSU-Ultra
          - BakaSU
          - KowSU
          - NoRoot
          - All
        default: FinaSU
      release_type:
        description: "Release Type"
        type: choice
        options:
          - CI
          - Pre-Release
          - Release
        default: CI
      use_cache:
        description: "Use ccache & Bazel cache (restore/save)"
        type: boolean
        default: true
      allow_version_mismatch:
        description: "Module Check Bypass (force check_version() to pass on mismatched module CRCs)"
        type: boolean
        default: false

      enable_susfs:
        description: "Enable SUSFS (FinaSU integrates it natively; leave ON for integrity hiding)"
        type: boolean
        default: true
      hide_shell_su:
        description: "Mask the shell->su SELinux transition from app probes (CONFIG_SELINUX_HIDE_SHELL_SU_TRANS). Needs the hide_shell_su.c/.h patch in-tree - inert without it. Defeats checkSELinuxAccess-style root detectors; leave ON for a hardened daily driver."
        type: boolean
        default: true
      metamodule:
        description: "Mount metamodule to prep the kernel for. VFS engines (NoMount/ZeroMount) are kernel-side; OverlayFS engines (Mountify/Hybrid) also get CONFIG_OVERLAY_FS=y. Every engine but 'none' enables TMPFS xattr + POSIX ACLs. The module zip is fetched and uploaded as a side artifact; 'none' skips both."
        type: choice
        options:
          - NoMount
          - ZeroMount
          - Mountify
          - Hybrid
          - Magic-Mount-rs
          - none
        default: NoMount
      security_patches:
        description: "Security patch level: monthly = latest tagged GKI/LTS (Google monthly, tested); latest-cve = also apply post-release stable CVE fixes on top (bleeding edge, may skip on conflict - READ THE README WARNING); none = base as pinned"
        type: choice
        options:
          - monthly
          - latest-cve
          - none
        default: monthly
      net_features:
        description: "Advanced Networking (WireGuard, BBRv3/BBR, IPSet, TTL/HL Target, CAKE, CIFS/SMB on 6.1/6.6) + NTSync (/dev/ntsync). 'both' (default), 'networking' or 'ntsync' for one, 'none' for neither."
        type: choice
        options:
          - both
          - networking
          - ntsync
          - none
        default: both
      enable_bpf:
        description: "Enable Extended BPF (BTF, eBPF, FUSE-BPF)"
        type: boolean
        default: true
      enable_droidspaces:
        description: "DroidSpaces-OSS complete container/Docker set (namespaces + SysV IPC + kABI patch + netfilter, GKI-ABI-safe)"
        type: boolean
        default: true
      enable_cgroup_limits:
        description: "Container CPU + process limits (--cpus/--pids-limit; CFS_BANDWIDTH + CGROUP_PIDS - shifts GKI ABI, the KMI check gates it, boot-test)"
        type: boolean
        default: false
      enable_performance:
        description: "Enable WildKernels Performance Tuning & Compression Patches (LZ4/ZSTD)"
        type: boolean
        default: true

      mosey_mode:
        description: "Mosey Extended (wonder_mosey_wild) Driver Integration Mode"
        type: choice
        options:
          - builtin
          - module
          - both
          - disabled
        default: both
      mosey_mac_addr:
        description: "Default Locally-Administered MAC for Mosey wonder0 (NL80211 vendor subcmd 5)"
        type: string
        default: "6a:b0:5d:c7:27:3d"
      enable_nlmon:
        description: "Enable CONFIG_NLMON=y (nlmon0 netlink pcap capture for Mosey debugging)"
        type: boolean
        default: true

      integrity_bundle:
        description: "Also fetch the newest integrity tools (Duck-ToolBox, OMK, PlayIntegrityFork, TEESimulator-RS, HMA-OSS) + Keybox Autopilot and attach Integrity_Tools.zip. See integrity/INSTALL_ORDER.md for the Strong/Certified/locked-bootloader combo."
        type: boolean
        default: false
      zram_algo:
        description: "ZRAM default compressor: lz4 (fastest, default) or zstd (higher ratio, more effective RAM)"
        type: choice
        options:
          - lz4
          - zstd
        default: lz4
      enable_rekernel:
        description: "Build Re-Kernel as an out-of-tree .ko (binder/signal netlink events). EXPERIMENTAL, OFF by default; needs a userspace consumer to do anything. Never affects the kernel image."
        type: boolean
        default: false

jobs:
  generate-matrix:
    name: "Resolve Kernel & Root Matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Build Dynamic Matrix JSON
        id: set-matrix
        shell: bash
        run: |
          python3 - << 'EOF'
          import base64
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          req_family = "${{ inputs.kernel_build_version }}"
          req_lts = "${{ inputs.gki_lts_version }}".strip()
          req_kmi = "${{ inputs.kmi_generation }}".strip().lower() or "auto"
          req_root = "${{ inputs.root_variant }}"
          if req_root == "All":
              roots = ["FinaSU", "KernelSU-Next", "KernelSU", "SukiSU-Ultra", "BakaSU", "KowSU"]
          else:
              roots = [req_root]

          all_families = [
              {"kernel_version": "android14-6.1",  "kver": "6.1",  "susfs_branch": "gki-android14-6.1",  "cache_type": "bazel", "build_tool": "bazel"},
              {"kernel_version": "android15-6.6",  "kver": "6.6",  "susfs_branch": "gki-android15-6.6",  "cache_type": "bazel", "build_tool": "bazel"},
              {"kernel_version": "android16-6.12", "kver": "6.12", "susfs_branch": "gki-android16-6.12", "cache_type": "bazel", "build_tool": "bazel"},
          ]

          selected = all_families if req_family == "all" else [f for f in all_families if f["kernel_version"] == req_family]

          if req_kmi != "auto" and not req_kmi.isdigit():
              print(f"::error::kmi_generation is '{req_kmi}': use 'auto' or the number from `uname -r` (…-android16-6-… is 6)")
              sys.exit(1)

          GOOGLE = "https://android.googlesource.com"

          def fetch(url):
              for attempt in (1, 2, 3):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code == 404 or attempt == 3:
                          raise
                  except Exception:
                      if attempt == 3:
                          raise
                  time.sleep(2 * attempt)

          def gitiles(repo, ref, path):
              return base64.b64decode(fetch(f"{GOOGLE}/{repo}/+/refs/heads/{ref}/{path}?format=TEXT")).decode("utf-8", "replace")

          def manifest_branches():
              return list(json.loads(fetch(f"{GOOGLE}/kernel/manifest/+refs/heads?format=JSON").decode().split("\n", 1)[1]))

          _seen = {}
          def branch_info(manifest_branch):
              """Version and KMI generation at the tip of what a manifest syncs, or None."""
              if manifest_branch not in _seen:
                  try:
                      manifest = gitiles("kernel/manifest", manifest_branch, "default.xml")
                      proj = re.search(r'<project[^>]*path="common"[^>]*>', manifest)
                      rev = re.search(r'revision="([^"]+)"', proj.group(0)) if proj else None
                      rev = (rev or re.search(r'<default[^>]*revision="([^"]+)"', manifest)).group(1)
                      makefile = gitiles("kernel/common", rev, "Makefile")
                      version = ".".join(re.search(rf"^{k} = (\d+)", makefile, re.M).group(1)
                                         for k in ("VERSION", "PATCHLEVEL", "SUBLEVEL"))
                      kmi = None
                      for f in ("build.config.constants", "build.config.common"):
                          try:
                              m = re.search(r"^KMI_GENERATION=(\d+)", gitiles("kernel/common", rev, f), re.M)
                          except Exception:
                              m = None
                          if m:
                              kmi = int(m.group(1))
                              break
                      _seen[manifest_branch] = {"manifest": manifest_branch, "branch": rev, "version": version, "kmi": kmi}
                  except Exception:
                      _seen[manifest_branch] = None
              return _seen[manifest_branch]

          def pick_branch(fam, kmi, asked):
              """Which of Google's branches to build for this family.

              kmi is 'auto' or a generation number, asked is a full x.y.z or None.

              The phone's drivers are built for one KMI generation and only load on a
              kernel of that same generation. The -lts branch moves on to the next one
              before any phone does: 6.12 -lts went to 7 while every release Google has
              cut, and with it the Pixel 10, is on 6 - and a generation-7 kernel on
              that phone is a bootloop. So "newest code" and "boots" are not always the
              same branch: take -lts while it is on the wanted generation, otherwise
              the newest dated release branch that is.
              """
              name = fam["kernel_version"]
              lts = branch_info(f"common-{name}-lts")
              try:
                  dated = sorted((b for b in manifest_branches()
                                  if re.fullmatch(rf"common-{re.escape(name)}-\d{{4}}-\d{{2}}", b)), reverse=True)
              except Exception as e:
                  print(f"::warning::could not list Google's release branches ({e})")
                  dated = []

              def releases(gen):
                  seen_one = False
                  for b in dated:
                      i = branch_info(b)
                      if not i or not i["kmi"]:
                          if seen_one:
                              return
                          continue
                      seen_one = True
                      if i["kmi"] < gen:
                          return
                      if i["kmi"] == gen:
                          yield i

              if kmi.isdigit():
                  want = int(kmi)
              else:
                  want = next((i["kmi"] for i in map(branch_info, dated) if i and i["kmi"]), None)
                  if want is None and lts:
                      want = lts["kmi"]
              if want is None:
                  print(f"::error::{name}: could not read Google's branches to work out the KMI generation. "
                        f"Nothing built - run it again.")
                  sys.exit(1)

              if lts and lts["kmi"] == want:
                  ref = next(releases(want), None)
                  return dict(lts, ref=ref["branch"] if ref else "", ref_exact="false")

              src = None
              if asked:
                  src = next((i for i in releases(want) if i["version"] == asked), None)
              src = src or next(releases(want), None)
              if src:
                  print(f"[i] {name}: -lts is on KMI generation {lts['kmi'] if lts else '?'}, "
                        f"building {src['branch']} ({src['version']}) which is on {want}")
                  return dict(src, ref=src["branch"], ref_exact="true")

              have = sorted({i["kmi"] for i in map(branch_info, dated[:6]) if i and i["kmi"]} | ({lts["kmi"]} if lts else set()))
              msg = f"{name}: no branch on KMI generation {want} (Google has {', '.join(map(str, have)) or 'none readable'})."
              if len(selected) == 1 or not kmi.isdigit():
                  print(f"::error::{msg}")
                  sys.exit(1)
              print(f"::warning::{msg} Using 'auto' for this family.")
              return None

          def requested(fam):
              if req_lts.isdigit():
                  return f'{fam["kver"]}.{int(req_lts)}'
              if re.fullmatch(re.escape(fam["kver"]) + r"\.\d+", req_lts):
                  return f'{fam["kver"]}.{int(req_lts.rsplit(".", 1)[1])}'
              return None

          req_all = req_lts.upper() == "ALL"

          def wanted_gen(fam):
              """The -lts branch info, the family's dated release branches (newest
              first), and the KMI generation we build for (req_kmi, or the newest
              Google has)."""
              name = fam["kernel_version"]
              lts = branch_info(f"common-{name}-lts")
              try:
                  dated = sorted((b for b in manifest_branches()
                                  if re.fullmatch(rf"common-{re.escape(name)}-\d{{4}}-\d{{2}}", b)), reverse=True)
              except Exception as e:
                  print(f"::warning::could not list Google's release branches ({e})")
                  dated = []
              if req_kmi.isdigit():
                  gen = int(req_kmi)
              else:
                  gen = next((i["kmi"] for i in map(branch_info, dated) if i and i["kmi"]), None)
                  if gen is None and lts:
                      gen = lts["kmi"]
              return lts, dated, gen

          def list_sources(fam):
              """Every distinct sublevel to build for 'All': the -lts tip (when it is
              on the wanted generation) plus each dated release branch on it, newest
              first, deduped by version. A gen-7 kernel on a gen-6 phone bootloops,
              so nothing off the wanted generation is ever added."""
              lts, dated, gen = wanted_gen(fam)
              on_gen, seen_gen = [], False
              for b in dated:
                  i = branch_info(b)
                  if not i or not i["kmi"]:
                      if seen_gen:
                          break
                      continue
                  if i["kmi"] < gen:
                      break
                  if i["kmi"] == gen:
                      seen_gen = True
                      on_gen.append(i)
              out, seen = [], set()
              if lts and lts["kmi"] == gen:
                  out.append(dict(lts, ref=on_gen[0]["branch"] if on_gen else "", ref_exact="false"))
                  seen.add(lts["version"])
              for i in on_gen:
                  if i["version"] in seen:
                      continue
                  out.append(dict(i, ref=i["branch"], ref_exact="true"))
                  seen.add(i["version"])
              return out, gen

          if not req_all and req_lts and req_lts.upper() != "LTS" and not any(requested(f) for f in selected):
              print(f"::warning::gki_lts_version '{req_lts}' is not a sublevel of the selected family; building the branch tip instead")

          include = []
          for fam in selected:
              if req_all:
                  srcs, gen = list_sources(fam)
                  if not srcs:
                      print(f"::error::{fam['kernel_version']}: found no branch on KMI generation {gen} to build. Nothing built - run it again.")
                      sys.exit(1)
                  built = []
                  for src in srcs:
                      entry = dict(fam)
                      entry["manifest_branch"] = src["manifest"]
                      entry["gki_branch"] = src["branch"]
                      entry["kmi_generation"] = str(src["kmi"] or "")
                      entry["kmi_ref_branch"] = src["ref"]
                      entry["kmi_ref_exact"] = src["ref_exact"]
                      entry["lts_version"] = src["version"] or f'{fam["kver"]}-LTS'
                      entry["follow_tip"] = "true" if src["ref_exact"] == "false" else "false"
                      for r in roots:
                          e = dict(entry)
                          e["root_variant"] = r
                          include.append(e)
                      built.append(src["version"] or "tip")
                  print(f"[i] {fam['kernel_version']}: building all {len(srcs)} sublevel(s) on KMI {gen}: {', '.join(built)}")
                  continue
              entry = dict(fam)
              want = requested(fam)
              src = pick_branch(fam, req_kmi, want) or pick_branch(fam, "auto", want)
              entry["manifest_branch"] = src["manifest"]
              entry["gki_branch"] = src["branch"]
              entry["kmi_generation"] = str(src["kmi"] or "")
              entry["kmi_ref_branch"] = src["ref"]
              entry["kmi_ref_exact"] = src["ref_exact"]
              tip = src["version"]
              if want == tip:
                  want = None
              if want and tip and int(want.rsplit(".", 1)[1]) > int(tip.rsplit(".", 1)[1]):
                  msg = f"{want} does not exist on {src['branch']}, which is at {tip}."
                  if len(selected) == 1:
                      print(f"::error::{msg} Use 'LTS' or a sublevel up to {tip.rsplit('.', 1)[1]}.")
                      sys.exit(1)
                  print(f"::warning::{msg} Building {tip} for this family.")
                  want = None
              if want:
                  entry["lts_version"] = want
                  entry["follow_tip"] = "false"
              else:
                  entry["lts_version"] = tip or f'{fam["kver"]}-LTS'
                  entry["follow_tip"] = "true"
              for r in roots:
                  e = dict(entry)
                  e["root_variant"] = r
                  include.append(e)

          if len(include) > 256:
              print(f"::error::this selection makes {len(include)} jobs and GitHub caps a matrix at 256. Narrow it: one family, 'LTS' or a single sublevel, or fewer root variants.")
              sys.exit(1)

          matrix_json = json.dumps({"include": include})
          print("Generated matrix:", matrix_json)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={matrix_json}\n")
          EOF

  build-fork-pipeline:
    name: "Fork Pipeline: ${{ matrix.kernel_version }} (${{ matrix.lts_version }})"
    needs: generate-matrix
    if: ${{ inputs.build_variant == 'wildkernels-fork-pipeline' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout WildKernels Repository
        uses: actions/checkout@v4

      - name: Inject Mosey Extended Driver Hook into .github/actions/build-kernel
        if: ${{ inputs.mosey_mode != 'disabled' }}
        shell: bash
        run: |
          mkdir -p .github/mosey
          git clone --depth=1 https://github.com/thelok1s/mosey-extended.git /tmp/mosey_extended || true

          if [ -f /tmp/mosey_extended/agy/ksu_wonder_module/mosey_wonder/wonder_mosey_wild.c ]; then
            cp -f /tmp/mosey_extended/agy/ksu_wonder_module/mosey_wonder/wonder_mosey_wild.c .github/mosey/wonder_mosey_wild.c
          elif [ -f /tmp/mosey_extended/system/vendor/bin/wonder/wonder_mosey_wild.c ]; then
            cp -f /tmp/mosey_extended/system/vendor/bin/wonder/wonder_mosey_wild.c .github/mosey/wonder_mosey_wild.c
          fi

          cat << 'EOF' > .github/mosey/inject_mosey.sh
          #!/usr/bin/env bash
          set -euo pipefail
          KSRC_DIR="${1:-common}"
          MOSEY_MODE="${2:-both}"
          DEFAULT_MAC="${3:-6a:b0:5d:c7:27:3d}"
          ENABLE_NLMON="${4:-true}"

          if [ ! -d "$KSRC_DIR/drivers/net/wireless" ]; then
            exit 0
          fi

          if [ -f "$GITHUB_WORKSPACE/.github/mosey/wonder_mosey_wild.c" ]; then
            cp -f "$GITHUB_WORKSPACE/.github/mosey/wonder_mosey_wild.c" "$KSRC_DIR/drivers/net/wireless/wonder_mosey_wild.c"
            sed -i "s/6a:b0:5d:c7:27:3d/${DEFAULT_MAC}/g" "$KSRC_DIR/drivers/net/wireless/wonder_mosey_wild.c"
          fi

          if ! grep -q "wonder_mosey_wild" "$KSRC_DIR/drivers/net/wireless/Makefile"; then
            if [ "$MOSEY_MODE" = "module" ]; then
              echo "obj-m += wonder_mosey_wild.o" >> "$KSRC_DIR/drivers/net/wireless/Makefile"
            else
              echo "obj-y += wonder_mosey_wild.o" >> "$KSRC_DIR/drivers/net/wireless/Makefile"
            fi
          fi

          # cfg80211/mac80211 are NOT forced into the image on GKI (they are
          # vendor modules); the wonder phy loads against the device's own
          # cfg80211. Nothing to add to the defconfig here.
          :
          EOF
          chmod +x .github/mosey/inject_mosey.sh

          if [ -f .github/actions/build-kernel/action.yml ]; then
            sed -i 's|tools/bazel|bash "$GITHUB_WORKSPACE/.github/mosey/inject_mosey.sh" common "${{ inputs.mosey_mode }}" "${{ inputs.mosey_mac_addr }}" "${{ inputs.enable_nlmon }}" \&\& tools/bazel|g' .github/actions/build-kernel/action.yml
          fi

      - name: Run WildKernels Build Action
        if: hashFiles('.github/actions/build-kernel/action.yml') != ''
        uses: ./.github/actions/build-kernel
        with:
          version: ${{ matrix.kernel_version }}
          page_size: ${{ inputs.page_size }}
          allow_version_mismatch: ${{ inputs.allow_version_mismatch }}

  build-all-versions-mosey:
    name: "Build ${{ matrix.kernel_version }} (${{ matrix.lts_version }} | KMI ${{ matrix.kmi_generation }} | ${{ matrix.root_variant }} + Mosey)"
    needs: generate-matrix
    if: ${{ inputs.build_variant == 'standalone-matrix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout WildKernels Fork Repository (for finasu_compat / bakasu_compat / susfs scripts)
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Maximize Runner Disk Space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install Build Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git git-lfs gnupg gperf \
            libdw-dev libelf-dev libncurses5-dev libssl-dev libxml2-utils lz4 pahole \
            python3 python3-pip rsync unzip wget xz-utils zip zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          mkdir -p ~/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Restore Build Cache (${{ matrix.cache_type }})
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/ccache
          key: wildkernel-mosey-${{ matrix.kernel_version }}-${{ matrix.lts_version }}-${{ matrix.root_variant }}-${{ github.run_id }}
          restore-keys: |
            wildkernel-mosey-${{ matrix.kernel_version }}-${{ matrix.lts_version }}-${{ matrix.root_variant }}-
            wildkernel-mosey-${{ matrix.kernel_version }}-

      - name: Sync Google GKI Kernel Manifest (${{ matrix.manifest_branch }})
        id: sync-kernel
        shell: bash
        run: |
          mkdir -p kernel_workspace && cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b "${{ matrix.manifest_branch }}" --depth=1
          repo sync -c -j"$(nproc --all)" --no-tags --no-clone-bundle --force-sync

          cd common
          VERSION=$(grep -E '^VERSION = ' Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep -E '^PATCHLEVEL = ' Makefile | awk '{print $3}')
          CURRENT_SUBLEVEL=$(grep -E '^SUBLEVEL = ' Makefile | awk '{print $3}')
          REQ_LTS="${{ matrix.lts_version }}"

          sublevel_commit() {
            local want="$1" hit="" below="" c s
            while read -r c; do
              s="$(git show "$c:Makefile" 2>/dev/null | sed -n 's/^SUBLEVEL = //p' | head -n1)"
              case "$s" in ''|*[!0-9]*) continue ;; esac
              if [ "$s" -eq "$want" ]; then
                hit="$c"
              elif [ "$s" -lt "$want" ]; then
                below=1
                break
              fi
            done < <(git log --first-parent --format=%H -- Makefile)
            if [ -n "$below" ] || [ "$(git rev-parse --is-shallow-repository)" = "false" ]; then
              echo "$hit"
              return 0
            fi
            return 1
          }

          if [ "${{ matrix.follow_tip }}" != "true" ]; then
            TARGET_SUBLEVEL="${REQ_LTS##*.}"
            case "$TARGET_SUBLEVEL" in
              ''|*[!0-9]*) echo "::error::can't read a sublevel out of '$REQ_LTS'"; exit 1 ;;
            esac
            if [ "$TARGET_SUBLEVEL" -gt "$CURRENT_SUBLEVEL" ]; then
              echo "::error::${VERSION}.${PATCHLEVEL}.${TARGET_SUBLEVEL} does not exist yet: ${{ matrix.manifest_branch }} is at ${VERSION}.${PATCHLEVEL}.${CURRENT_SUBLEVEL}. Use 'LTS' or a sublevel up to ${CURRENT_SUBLEVEL}."
              exit 1
            fi
            if [ "$TARGET_SUBLEVEL" -lt "$CURRENT_SUBLEVEL" ]; then
              REMOTE="$(git remote | head -n1)"
              COMMON_REV="$(cd .. && repo forall common -c 'echo "$REPO_RREV"' 2>/dev/null | head -n1 || true)"
              [ -n "$COMMON_REV" ] || COMMON_REV="${{ matrix.manifest_branch }}"
              COMMON_REV="${COMMON_REV#common-}"
              MATCH_COMMIT=""
              for depth in have 300 1500 6000 all; do
                case "$depth" in
                  have) ;;
                  all)  git fetch -q --unshallow "${REMOTE:-aosp}" "$COMMON_REV" || true ;;
                  *)    git fetch -q --depth="$depth" "${REMOTE:-aosp}" "$COMMON_REV" || true ;;
                esac
                if MATCH_COMMIT="$(sublevel_commit "$TARGET_SUBLEVEL")"; then
                  break
                fi
              done
              if [ -z "$MATCH_COMMIT" ]; then
                echo "::error::no commit on $COMMON_REV carries ${VERSION}.${PATCHLEVEL}.${TARGET_SUBLEVEL} (the branch may have started later than that)"
                exit 1
              fi
              echo "[+] ${VERSION}.${PATCHLEVEL}.${TARGET_SUBLEVEL} -> $(git log -1 --format='%h %s' "$MATCH_COMMIT")"
              git checkout -q "$MATCH_COMMIT"
              CURRENT_SUBLEVEL=$(grep -E '^SUBLEVEL = ' Makefile | awk '{print $3}')
              if [ "$CURRENT_SUBLEVEL" != "$TARGET_SUBLEVEL" ]; then
                echo "::error::checked out $MATCH_COMMIT but its Makefile says SUBLEVEL=$CURRENT_SUBLEVEL, not $TARGET_SUBLEVEL"
                exit 1
              fi
            fi
          fi

          RESOLVED_KVER="${VERSION}.${PATCHLEVEL}.${CURRENT_SUBLEVEL}"
          if [ "$REQ_LTS" != "$RESOLVED_KVER" ]; then
            echo "::notice::job name says $REQ_LTS, the tree that was synced is $RESOLVED_KVER - the artifacts carry the real one"
          fi

          KMI_GEN="$(sed -n 's/^KMI_GENERATION=//p' build.config.constants build.config.common 2>/dev/null | head -n1)"
          WANT_KMI="${{ matrix.kmi_generation }}"
          if [ -n "$WANT_KMI" ] && [ "$KMI_GEN" != "$WANT_KMI" ]; then
            echo "::error::${RESOLVED_KVER} on ${{ matrix.gki_branch }} is KMI generation ${KMI_GEN:-unknown}, this run is for generation ${WANT_KMI}. An older sublevel can sit on an older generation: pick one from this generation or set kmi_generation to match the phone."
            exit 1
          fi
          BRANCH_TAG="$(sed -n 's/^BRANCH=//p' build.config.constants build.config.common 2>/dev/null | head -n1)"
          KMI_TAG="${BRANCH_TAG%-*}-${KMI_GEN}"

          echo "resolved_kver=${RESOLVED_KVER}" >> "$GITHUB_OUTPUT"
          echo "resolved_sublevel=${CURRENT_SUBLEVEL}" >> "$GITHUB_OUTPUT"
          echo "kmi_generation=${KMI_GEN}" >> "$GITHUB_OUTPUT"
          echo "kmi_tag=${KMI_TAG}" >> "$GITHUB_OUTPUT"
          echo "[*] Building kernel version: ${RESOLVED_KVER} (${{ matrix.gki_branch }}, KMI ${KMI_TAG})"

      - name: Fetch WildKernels Patches, SUSFS (${{ matrix.susfs_branch }}), and Mosey Extended
        shell: bash
        run: |
          cd kernel_workspace
          V_WILD="$GITHUB_WORKSPACE/sources/wild_patches"
          if [ -d "$V_WILD" ]; then
            echo "[+] Using vendored wild_patches from repo"
            mkdir -p wild_patches && cp -a "$V_WILD/." wild_patches/
          else
            git clone --depth=1 https://github.com/WildKernels/kernel_patches.git wild_patches
          fi
          V_SUSFS="$GITHUB_WORKSPACE/sources/susfs4ksu"
          SUSFS_KPATCH="50_add_susfs_in_${{ matrix.susfs_branch }}.patch"
          if [ -f "$V_SUSFS/kernel_patches/$SUSFS_KPATCH" ]; then
            echo "[+] Using vendored susfs4ksu from repo (FinaSU-pinned v2.3.0, $SUSFS_KPATCH)"
            rm -rf susfs4ksu && cp -a "$V_SUSFS" susfs4ksu
          else
            git clone --depth=1 -b "${{ matrix.susfs_branch }}" https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu || true
            case "${{ matrix.susfs_branch }}" in
              gki-android14-6.1)  SUSFS_PIN="b57ed1998b82c4e3a2a81cdbf11172a560979c40" ;;
              gki-android15-6.6)  SUSFS_PIN="4a4cb1be85a4694372d3efb9420de69982eac29a" ;;
              gki-android16-6.12) SUSFS_PIN="9c9f19d8395693327c78df36569b44e94c187b8a" ;;
              *)                  SUSFS_PIN="" ;;
            esac
            if [ -d susfs4ksu/.git ] && [ -n "$SUSFS_PIN" ]; then
              git -C susfs4ksu fetch --unshallow 2>/dev/null || git -C susfs4ksu fetch --depth=100 origin "${{ matrix.susfs_branch }}" 2>/dev/null || true
              if git -C susfs4ksu checkout -q "$SUSFS_PIN" 2>/dev/null; then
                echo "[+] SUSFS pinned to FinaSU-compatible commit ${SUSFS_PIN:0:10}"
              else
                echo "::warning::could not pin SUSFS to $SUSFS_PIN - FinaSU may not boot with branch-tip SUSFS"
              fi
            fi
          fi
          git clone --depth=1 https://github.com/thelok1s/mosey-extended.git mosey_extended

      - name: Integrate Root Implementation (${{ matrix.root_variant }})
        shell: bash
        run: |
          cd kernel_workspace
          DRIVERS_DIR="common/drivers"
          rm -rf "$DRIVERS_DIR/kernelsu"

          VARIANT="${{ matrix.root_variant }}"
          if [ "$VARIANT" = "NoRoot" ]; then
            echo "[i] NoRoot: GKI + SUSFS with no KernelSU driver (CONFIG_KSU stays off)"
            exit 0
          fi

          ROOT_BRANCH=""
          case "$VARIANT" in
            FinaSU)        ROOT_REPO="https://github.com/LyraVoid/FinaSU.git";            ROOT_DIR="FinaSU" ;;
            BakaSU)        ROOT_REPO="https://github.com/Baka-SU/BakaSU.git";             ROOT_DIR="BakaSU" ;;
            KernelSU)      ROOT_REPO="https://github.com/tiann/KernelSU.git";             ROOT_DIR="KernelSU";      ROOT_BRANCH="main" ;;
            SukiSU-Ultra)  ROOT_REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git";  ROOT_DIR="SukiSU-Ultra";  ROOT_BRANCH="main" ;;
            KowSU)         ROOT_REPO="https://github.com/KOWX712/KernelSU.git";           ROOT_DIR="KowSU";         ROOT_BRANCH="master" ;;
            KernelSU-Next)
              if [ "${{ inputs.enable_susfs }}" = "true" ]; then
                ROOT_REPO="https://github.com/pershoot/KernelSU-Next.git";  ROOT_DIR="KernelSU-Next"; ROOT_BRANCH="dev-susfs"
              else
                ROOT_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"; ROOT_DIR="KernelSU-Next"; ROOT_BRANCH="next"
              fi ;;
            *) echo "::error::unknown root_variant '$VARIANT'"; exit 1 ;;
          esac

          echo "[+] Cloning ${ROOT_DIR} from ${ROOT_REPO}..."
          rm -rf "$ROOT_DIR"
          if [ "$VARIANT" = "FinaSU" ]; then
            FINASU_PIN="2d5786b9129a254a87ac358c8bec0203ccd53351"
            git clone "$ROOT_REPO" "$ROOT_DIR"
            if git -C "$ROOT_DIR" checkout -q "$FINASU_PIN" 2>/dev/null; then
              echo "[+] FinaSU pinned to ${FINASU_PIN:0:10}"
            else
              echo "::warning::could not pin FinaSU to ${FINASU_PIN:0:10}; building branch tip"
            fi
          elif [ -n "$ROOT_BRANCH" ]; then
            git clone --depth=1 -b "$ROOT_BRANCH" "$ROOT_REPO" "$ROOT_DIR" || git clone --depth=1 "$ROOT_REPO" "$ROOT_DIR"
          else
            git clone --depth=1 "$ROOT_REPO" "$ROOT_DIR"
          fi

          if [ ! -d "$ROOT_DIR/kernel" ]; then
            echo "[-] Error: $ROOT_DIR/kernel directory not found!"
            exit 1
          fi

          REL_KERNEL="$(realpath --relative-to="$DRIVERS_DIR" "$PWD/$ROOT_DIR/kernel")"
          ln -s "$REL_KERNEL" "$DRIVERS_DIR/kernelsu"
          echo "[+] Linked $DRIVERS_DIR/kernelsu -> $REL_KERNEL"

          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$DRIVERS_DIR/Makefile" || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVERS_DIR/Makefile"

          if [ -f "$DRIVERS_DIR/Kconfig" ] && ! grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVERS_DIR/Kconfig"; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVERS_DIR/Kconfig"
          fi

          if [ "$VARIANT" = "FinaSU" ] && [ -f "$ROOT_DIR/kernel/Kbuild" ]; then
            FINA_SZ="0x02cc"
            FINA_HASH="2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458"
            FMGR="$(ls "$GITHUB_WORKSPACE"/managers/*.apk 2>/dev/null | head -1 || true)"
            if [ -z "$FMGR" ]; then
              mkdir -p "$RUNNER_TEMP/fmgr"
              GH_TOKEN="${{ github.token }}" gh release download --repo LyraVoid/FinaSU --pattern '*.apk' --dir "$RUNNER_TEMP/fmgr" 2>/dev/null || true
              FMGR="$(ls "$RUNNER_TEMP"/fmgr/*.apk 2>/dev/null | head -1 || true)"
            fi
            if [ -n "$FMGR" ] && [ -f "$GITHUB_WORKSPACE/scripts/apk_sig.py" ]; then
              SIG="$(python3 "$GITHUB_WORKSPACE/scripts/apk_sig.py" "$FMGR" 2>/dev/null || true)"
              if printf '%s' "$SIG" | grep -qE '^0x[0-9a-f]+ [0-9a-f]{64}$'; then
                FINA_SZ="${SIG%% *}"; FINA_HASH="${SIG##* }"
                echo "[+] FinaSU manager sig computed from $(basename "$FMGR"): $FINA_SZ"
              else
                echo "::warning::FinaSU: live sig compute failed; using known v1.4.x fallback"
              fi
            fi
            sed -i "s/^KSU_EXPECTED_SIZE := .*/KSU_EXPECTED_SIZE := $FINA_SZ/" "$ROOT_DIR/kernel/Kbuild"
            sed -i "s/^KSU_EXPECTED_HASH := .*/KSU_EXPECTED_HASH := $FINA_HASH/" "$ROOT_DIR/kernel/Kbuild"
            grep -q "$FINA_HASH" "$ROOT_DIR/kernel/Kbuild" \
              && echo "[+] FinaSU: trusted manager baked ($FINA_SZ)" \
              || echo "::warning::FinaSU: could not bake manager signature (Kbuild format changed)"
          fi

      - name: Apply SUSFS (${{ matrix.susfs_branch }}) & Regular WildKernels Feature Patches
        shell: bash
        run: |
          cd kernel_workspace
          PATCH_DIR="$GITHUB_WORKSPACE/kernel_workspace/wild_patches"
          SUSFS_DIR="$GITHUB_WORKSPACE/kernel_workspace/susfs4ksu"
          KVER_SHORT="${{ matrix.kver }}"
          SUBLEVEL="${{ steps.sync-kernel.outputs.resolved_sublevel }}"

          if [ "${{ inputs.enable_susfs }}" = "true" ] && [ -d "$SUSFS_DIR/kernel_patches" ]; then
            SUSFS_PATCH="$SUSFS_DIR/kernel_patches/50_add_susfs_in_${{ matrix.susfs_branch }}.patch"
            if [ ! -f "$SUSFS_PATCH" ]; then
              echo "::error::SUSFS: no kernel patch for ${{ matrix.susfs_branch }} (expected $(basename "$SUSFS_PATCH"))"
              exit 1
            fi
            echo "[+] Copying SUSFS fs/ and include/linux/ sources..."
            cp -rf "$SUSFS_DIR/kernel_patches/fs/"* common/fs/ || true
            cp -rf "$SUSFS_DIR/kernel_patches/include/linux/"* common/include/linux/ || true

            cd common
            find . -name "*.rej" -delete || true
            echo "[+] Applying $(basename "$SUSFS_PATCH")"
            if ! patch -p1 --forward < "$SUSFS_PATCH"; then
              echo "::error::SUSFS patch does not fit ${{ matrix.gki_branch }} ($KVER_SHORT.$SUBLEVEL): it is written for a different sublevel of this family. Build the branch 'LTS' picks instead of this sublevel."
              find . -name "*.rej" | sed 's/^/  reject: /'
              exit 1
            fi

            U="$PATCH_DIR/common/unicode_bypass_fix_6.1+.patch"
            [ -f "$U" ] && patch -p1 --forward --fuzz=3 < "$U" || true
          else
            cd common
          fi

          find . \( -name "*.rej" -o -name "*.orig" \) -delete || true

          if true; then
            echo "[+] Integrating Baseband Guard (BBG)..."
            BV="$GITHUB_WORKSPACE/sources/baseband-guard"
            if [ -d "$BV" ]; then
              echo "[+] Using vendored Baseband-guard from repo (pinned)"
              rm -rf Baseband-guard security/baseband-guard
              cp -a "$BV" Baseband-guard
              git -C Baseband-guard init -q 2>/dev/null || true
              git -C Baseband-guard remote add origin https://github.com/vc-teahouse/Baseband-guard 2>/dev/null || true
              ln -sfn ../Baseband-guard security/baseband-guard
              grep -q 'baseband-guard/' security/Makefile || \
                printf '\nobj-$(CONFIG_BBG) += baseband-guard/\n' >> security/Makefile
              grep -q 'security/baseband-guard/Kconfig' security/Kconfig || \
                sed -i 's#^source "security/keys/Kconfig"#&\nsource "security/baseband-guard/Kconfig"#' security/Kconfig
              if [ -f security/baseband-guard/baseband_guard.c ] && grep -q 'security/baseband-guard/Kconfig' security/Kconfig; then
                echo "[+] Baseband-guard wired (sources + Kconfig/Makefile)"
              else
                echo "::error::Baseband-guard could not be wired into security/"
                exit 1
              fi
            else
              curl -LSs https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash || true
            fi
            if [ -d security/baseband-guard ]; then
              sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
              DEF="arch/arm64/configs/gki_defconfig"
              if grep -q '^CONFIG_LSM=' "$DEF" && ! grep -q '^CONFIG_LSM=.*baseband_guard' "$DEF"; then
                sed -i 's/^\(CONFIG_LSM="[^"]*\)selinux/\1selinux,baseband_guard/' "$DEF"
              fi
              grep -q baseband_guard security/Kconfig \
                && echo "[+] baseband_guard added to CONFIG_LSM default" \
                || echo "::warning::BBG: could not add baseband_guard to CONFIG_LSM"
            fi
          fi

          if true; then
            echo "[+] Integrating NV write guard (nv_guard LSM)..."
            NVD="$GITHUB_WORKSPACE/kernel-patches/nv_guard"
            if [ ! -f security/nv_guard/nv_guard.c ] && [ -f "$NVD/nv_guard.c" ]; then
              mkdir -p security/nv_guard
              cp "$NVD/nv_guard.c" "$NVD/Kconfig" "$NVD/Makefile" security/nv_guard/
              echo "[+] nv_guard sources copied into security/nv_guard/"
            fi
            if [ -f security/nv_guard/nv_guard.c ]; then
              grep -q 'security/nv_guard/Kconfig' security/Kconfig || \
                sed -i 's#^source "security/keys/Kconfig"#&\nsource "security/nv_guard/Kconfig"#' security/Kconfig
              grep -q 'nv_guard/' security/Makefile || \
                printf 'obj-$(CONFIG_NV_WRITE_GUARD) += nv_guard/\n' >> security/Makefile
              DEF="arch/arm64/configs/gki_defconfig"
              grep -q '^CONFIG_NV_WRITE_GUARD=y' "$DEF" || echo 'CONFIG_NV_WRITE_GUARD=y' >> "$DEF"
              sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /nv_guard/! s/selinux/selinux,nv_guard/ } }' security/Kconfig
              if grep -q '^CONFIG_LSM=' "$DEF" && ! grep -q '^CONFIG_LSM=.*nv_guard' "$DEF"; then
                sed -i 's/^\(CONFIG_LSM="[^"]*\)selinux/\1selinux,nv_guard/' "$DEF"
              fi
              echo "[+] nv_guard wired (sources + Kconfig/Makefile + CONFIG_LSM)"
            else
              echo "::warning::nv_write_guard requested but kernel-patches/nv_guard sources not found; skipping"
            fi
          fi

          if [ -d security/baseband-guard ] || [ -f security/nv_guard/nv_guard.c ]; then
            if ! sh "$GITHUB_WORKSPACE/kernel-patches/lsm-slots/add-lsm-slots.sh" .; then
              echo "::error::could not reserve LSM slots for Baseband-guard / nv_guard"
              exit 1
            fi
          fi

          if true; then
            echo "[+] Applying USB hardening switches (deny_new_usb + deny_usb_gadget)..."
            USBD="$GITHUB_WORKSPACE/kernel-patches/usb-hardening"
            if [ -d "$USBD" ]; then
              for p in "$USBD"/0001-usb-core-add-deny_new_usb-sysctl.patch \
                       "$USBD"/0002-usb-gadget-add-deny_usb_gadget-sysctl.patch; do
                [ -f "$p" ] || { echo "::error::USB hardening: missing $(basename "$p")"; exit 1; }
                if patch -p1 -N -s --fuzz=3 --dry-run -i "$p" >/dev/null 2>&1; then
                  patch -p1 -N -s --fuzz=3 --no-backup-if-mismatch -i "$p"
                  echo "[+] applied $(basename "$p")"
                else
                  echo "::error::USB hardening patch did not apply cleanly: $(basename "$p")"
                  exit 1
                fi
              done
              echo "[+] USB hardening switches in place"
            else
              echo "::error::USB hardening requested but kernel-patches/usb-hardening not found"
              exit 1
            fi
          fi

          if true; then
            echo "[+] Applying @Dev_DcS kernel hardening config..."
            DEF="arch/arm64/configs/gki_defconfig"
            grep -q '^CONFIG_ZERO_CALL_USED_REGS=y'   "$DEF" || echo 'CONFIG_ZERO_CALL_USED_REGS=y'   >> "$DEF"
            grep -q '^CONFIG_SECURITY_DMESG_RESTRICT=y' "$DEF" || echo 'CONFIG_SECURITY_DMESG_RESTRICT=y' >> "$DEF"
            case "${{ matrix.kernel_version }}" in
              android15-6.6|android16-6.12)
                grep -q '^CONFIG_LIST_HARDENED=y' "$DEF" || echo 'CONFIG_LIST_HARDENED=y' >> "$DEF"
                ;;
              *)
                echo "[i] LIST_HARDENED skipped on ${{ matrix.kernel_version }} (6.6+ only)"
                ;;
            esac
            echo "[+] hardening config appended"
          fi

          if true; then
            echo "[+] Applying TracerPid leak fix (hide_tracerpid)..."
            TPP="$GITHUB_WORKSPACE/kernel-patches/hardening/0001-proc-hide-tracerpid.patch"
            if [ -f "$TPP" ]; then
              if patch -p1 -N -s --fuzz=3 --dry-run -i "$TPP" >/dev/null 2>&1; then
                patch -p1 -N -s --fuzz=3 --no-backup-if-mismatch -i "$TPP"
                echo "[+] TracerPid fix applied"
              else
                echo "::error::TracerPid patch did not apply cleanly"
                exit 1
              fi
            else
              echo "::error::TracerPid fix requested but patch not found"
              exit 1
            fi
          fi

          case "${{ inputs.security_patches }}" in
            latest-cve)
              echo "[+] security_patches=latest-cve: topping up with post-release stable CVE fixes..."
              git config user.email "ci@local" 2>/dev/null || true
              git config user.name "ci" 2>/dev/null || true
              KVER="$(make -s kernelversion 2>/dev/null || true)"
              SERIES="$(echo "$KVER" | cut -d. -f1-2)"
              OUTD="$GITHUB_WORKSPACE/cve-out"; mkdir -p "$OUTD"
              OKF="$OUTD/cve-applied.txt"; SKF="$OUTD/cve-skipped.txt"; : > "$OKF"; : > "$SKF"
              STABLE="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git"
              if git fetch --no-tags --depth=400 "$STABLE" "linux-${SERIES}.y:refs/cve_tip" "refs/tags/v${KVER}:refs/tags/v${KVER}" 2>/dev/null; then
                for d in 800 1600 3200; do
                  git merge-base --is-ancestor "v${KVER}" refs/cve_tip 2>/dev/null && break
                  git fetch --no-tags --deepen="$d" "$STABLE" "linux-${SERIES}.y:refs/cve_tip" 2>/dev/null || break
                done
                if git merge-base --is-ancestor "v${KVER}" refs/cve_tip 2>/dev/null; then
                  mapfile -t SHAS < <(git rev-list --reverse "v${KVER}..refs/cve_tip" 2>/dev/null)
                  echo "[i] ${SERIES}: ${#SHAS[@]} post-${KVER} stable commits to try"
                  for sha in "${SHAS[@]}"; do
                    subj="$(git log -1 --format='%s' "$sha" 2>/dev/null || true)"
                    if git format-patch -1 --stdout "$sha" 2>/dev/null | git am --3way >/dev/null 2>&1; then
                      echo "$sha  $subj" >> "$OKF"
                    else
                      git am --abort >/dev/null 2>&1 || true
                      echo "$sha  $subj" >> "$SKF"
                    fi
                  done
                  echo "[+] latest-cve: applied $(wc -l < "$OKF" | tr -d ' '), skipped $(wc -l < "$SKF" | tr -d ' ') (lists in cve-out/)"
                else
                  echo "::warning::latest-cve: base tag v${KVER} not reachable in the synced tree; skipping CVE top-up (monthly base is unchanged)"
                fi
              else
                echo "::warning::latest-cve: could not fetch the stable tree for ${SERIES}; skipping CVE top-up"
              fi
              ;;
            none)
              echo "[i] security_patches=none: building the base exactly as pinned"
              ;;
            *)
              echo "[i] security_patches=monthly: latest tagged GKI/LTS base carries the Android monthly CVE set"
              ;;
          esac

          if [ "${{ (inputs.net_features == 'both' || inputs.net_features == 'ntsync') && 'true' || 'false' }}" = "true" ]; then
            echo "[+] Applying NTSync for ${{ matrix.kernel_version }}..."
            NT="$PATCH_DIR/common/ntsync"
            if [ "${{ matrix.kernel_version }}" = "android16-6.12" ]; then
              rm -f include/uapi/linux/ntsync.h drivers/misc/ntsync.c
            fi
            COMPAT="$NT/ntsync_compat_${{ matrix.kernel_version }}.patch"
            if [ -f "$COMPAT" ]; then patch -p1 --forward --fuzz=3 < "$COMPAT" || true; else echo "::warning::NTSync: compat patch not found ($COMPAT)"; fi
            if [ -f "$NT/ntsync_base.patch" ]; then patch -p1 --forward --fuzz=3 < "$NT/ntsync_base.patch" || true; else echo "::warning::NTSync: ntsync_base.patch not found"; fi
          fi

          if [ "${{ (inputs.net_features == 'both' || inputs.net_features == 'networking') && 'true' || 'false' }}" = "true" ]; then
            echo "[+] Applying Networking patches for ${KVER_SHORT}..."
            find "$PATCH_DIR/common" -path "*${KVER_SHORT}*" -name "*bbr*.patch" -exec sh -c 'patch -p1 --forward --fuzz=3 < "$1" || true' _ {} \;
          fi

          if [ "${{ inputs.enable_droidspaces }}" = "true" ]; then
            echo "[+] Applying DroidSpaces-OSS kernel patches..."
            DSP="$PATCH_DIR/common/droidspaces"

            apply_dsp_soft() {
              f="$1"; label="$2"
              if [ ! -f "$f" ]; then echo "::warning::DroidSpaces: $label patch not found ($f)"; return; fi
              if patch -p1 -N -s --dry-run -i "$f" >/dev/null 2>&1; then
                patch -p1 -N -s --no-backup-if-mismatch -i "$f"; echo "  [ok]   $label"
              else
                echo "::warning::DroidSpaces: $label did not apply on ${{ matrix.kernel_version }}; skipped"
              fi
            }
            apply_dsp_soft "$DSP/0001-Return-ghost-task-if-task-is-null-and-is-requested-b.patch" "ghost-task pid.c guard"
            apply_dsp_soft "$DSP/0001-Guard-USER_NS-for-non-root-users.patch" "USER_NS non-root guard"
            apply_dsp_soft "$DSP/export_ipc_ns_for_rust_binder.patch" "export ipc_ns for rust binder (6.12 rust_binder.ko)"

            case "$KVER_SHORT" in
              6.12|6.13|6.14|6.15) KABI="$DSP/fix_sysvipc_kabi_a16-6.12.patch"; SLOTS="gendwarfksyms __kabi_ignored unions" ;;
              *)                   KABI="$DSP/fix_sysvipc_kabi_6_7_8.patch";    SLOTS="ANDROID_KABI reserved slots 6/7/8" ;;
            esac
            echo "[+] SysV IPC: relocating sysvsem/sysvshm ($SLOTS) for ${KVER_SHORT}..."
            if [ ! -f "$KABI" ]; then
              echo "::error::DroidSpaces: SysV IPC kABI patch missing ($KABI)"; exit 1
            fi
            if ! patch -p1 -N --fuzz=3 --dry-run -i "$KABI" >/dev/null 2>&1; then
              echo "::error::DroidSpaces: $(basename "$KABI") does not apply on ${{ matrix.kernel_version }} - refusing to enable CONFIG_SYSVIPC without the kABI relocation (would bootloop). Check the ANDROID_KABI reserved slots are still free in task_struct."
              exit 1
            fi
            patch -p1 -N --fuzz=3 --no-backup-if-mismatch -i "$KABI"
            echo "  [ok]   SysV IPC kABI relocation applied (task_struct CRC unchanged)"
          fi

          if [ "${{ inputs.enable_performance }}" = "true" ]; then
            echo "[+] Applying WildKernels performance patches..."
            for name in \
              add_timeout_wakelocks_globally adjust_cpu_scan_order \
              avoid_extra_s2idle_wake_attempts clear_page_16bytes_align \
              disable_cache_hot_buddy f2fs_enlarge_min_fsync_blocks \
              f2fs_reduce_congestion file_struct_8bytes_align \
              increase_ext4_default_commit_age increase_sk_mem_packets \
              int_sqrt mem_opt_prefetch minimise_wakeup_time optimise_memcmp \
              optimized_mem_operations reduce_cache_pressure reduce_freeze_timeout \
              reduce_gc_thread_sleep_time reduce_pci_pme_wakeups \
              use_unlikely_wrap_cpufreq; do
              p="$PATCH_DIR/common/${name}.patch"
              [ -f "$p" ] || continue
              if patch -p1 -N -s --dry-run -i "$p" >/dev/null 2>&1; then
                patch -p1 -N -s --no-backup-if-mismatch -i "$p"
                echo "  [ok]   $name"
              else
                echo "  [skip] $name (doesn't apply on ${{ matrix.kernel_version }})"
              fi
            done
          fi

          if [ "${{ inputs.allow_version_mismatch }}" = "true" ] && [ -f kernel/module/version.c ]; then
            echo "[+] Applying Module Check Bypass..."
            sed -i 's/return 0;/return 1;/g' kernel/module/version.c || true
          fi

          find . \( -name "*.rej" -o -name "*.orig" \) -delete || true

      - name: Prepare Mosey wonder driver source (out-of-tree, cfg80211-only)
        if: ${{ inputs.mosey_mode != 'disabled' }}
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/mosey_src"
          rm -rf "$SRC"; mkdir -p "$SRC"

          cat > "$SRC/Kbuild" <<'KBUILD_EOF'
          obj-m += wonder_mosey_wild.o
          KBUILD_EOF

          cat > "$SRC/wonder_mosey_wild.c" <<'WONDER_EOF'
          // SPDX-License-Identifier: GPL-2.0
          /*
           * wonder_mosey_wild - fake "wonder" wiphy for Mosey (Quick Share / AirDrop)
           *
           * mosey_server wants a phy called "wonder" it can hang a monitor
           * interface off (wonder0), tune to ch149 and poke with Broadcom-style
           * vendor commands (OUI 0x001A11, subcmds 1..5). Pixel 9/10 get that from
           * bcmdhd's wondertap, everything else gets this.
           *
           * Interface follows thelok1s/mosey-extended's README. This is a plain
           * cfg80211 driver on purpose: phones ship cfg80211 as a vendor module but
           * most never load mac80211, so depending on it would rule out half the
           * devices out there.
           *
           * No radio behind it. Frames sent on wonder0 are dropped, nothing is ever
           * received. It only exists so mosey_server's bring-up completes.
           *
           * Pixel 10 series (blazer) has native wondertap in the BCM4398 (bcmdhd), so
           * there this driver is a no-op fallback - it loads only on devices that have
           * no real wonder phy. The 5 GHz table leads with ch149/5745, the channel
           * Quick Share / mosey uses, so an emulated phy advertises it first.
           *
           * @Dev_DcS
           */

          #define pr_fmt(fmt) KBUILD_MODNAME ": " fmt

          #include <linux/module.h>
          #include <linux/moduleparam.h>
          #include <linux/etherdevice.h>
          #include <linux/netdevice.h>
          #include <linux/if_arp.h>
          #include <linux/rtnetlink.h>
          #include <linux/spinlock.h>
          #include <linux/version.h>
          #include <net/cfg80211.h>
          #include <net/netlink.h>

          #define WONDER_OUI		0x001A11
          #define WONDER_MAX_IFACES	4

          enum wonder_subcmd {
          	WONDER_SET_FREQ		= 1,
          	WONDER_SET_FILTER	= 2,
          	WONDER_SET_FIXED_TX_RATE = 3,
          	WONDER_SET_REG		= 4,
          	WONDER_GET_IF_MAC_ADDR	= 5,
          };

          /*
           * 5.12 moved interface add/del under the wiphy mutex and gave drivers
           * cfg80211_{,un}register_netdevice() for it.
           */
          #if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 12, 0)
          #define WONDER_WIPHY_MTX 1
          #endif

          static struct wiphy *wonder_wiphy;

          /* ---- module params ---------------------------------------------------- */

          static DEFINE_SPINLOCK(wonder_mac_lock);
          static u8 wonder_mac[ETH_ALEN] = { 0x6a, 0xb0, 0x5d, 0xc7, 0x27, 0x3d };

          static void wonder_get_mac(u8 *out)
          {
          	spin_lock_bh(&wonder_mac_lock);
          	ether_addr_copy(out, wonder_mac);
          	spin_unlock_bh(&wonder_mac_lock);
          }

          static int wonder_mac_set(const char *val, const struct kernel_param *kp)
          {
          	char buf[24];	/* "xx:xx:xx:xx:xx:xx" plus whatever echo tacks on */
          	u8 mac[ETH_ALEN];

          	if (strscpy(buf, val, sizeof(buf)) < 0)
          		return -EINVAL;
          	if (!mac_pton(strim(buf), mac))
          		return -EINVAL;
          	/* unicast + locally administered, same rule mosey-extended documents */
          	if (!is_valid_ether_addr(mac) || !(mac[0] & 0x02))
          		return -EINVAL;

          	spin_lock_bh(&wonder_mac_lock);
          	ether_addr_copy(wonder_mac, mac);
          	spin_unlock_bh(&wonder_mac_lock);
          	return 0;
          }

          static int wonder_mac_get(char *buf, const struct kernel_param *kp)
          {
          	u8 mac[ETH_ALEN];

          	wonder_get_mac(mac);
          	return sysfs_emit(buf, "%pM\n", mac);
          }

          static const struct kernel_param_ops wonder_mac_ops = {
          	.set = wonder_mac_set,
          	.get = wonder_mac_get,
          };
          module_param_cb(mac_addr, &wonder_mac_ops, NULL, 0644);
          MODULE_PARM_DESC(mac_addr,
          	"MAC handed back for vendor subcmd 5 (locally administered, default 6a:b0:5d:c7:27:3d)");

          /*
           * Nobody outside Google knows how mosey_server unpacks the subcmd 5 reply.
           * 0 = bare 6 bytes in VENDOR_DATA, 1 = wrapped in nl attribute 1.
           * Writable so it can be flipped on a live device without rebuilding.
           */
          static int mac_reply_fmt;
          module_param(mac_reply_fmt, int, 0644);
          MODULE_PARM_DESC(mac_reply_fmt, "Subcmd 5 reply: 0 = raw bytes (default), 1 = nla type 1");

          /* ---- monitor netdev --------------------------------------------------- */

          static netdev_tx_t wonder_xmit(struct sk_buff *skb, struct net_device *dev)
          {
          	dev->stats.tx_dropped++;
          	dev_kfree_skb_any(skb);
          	return NETDEV_TX_OK;
          }

          static const struct net_device_ops wonder_netdev_ops = {
          	.ndo_start_xmit = wonder_xmit,
          };

          static void wonder_netdev_setup(struct net_device *dev)
          {
          	ether_setup(dev);
          	dev->type = ARPHRD_IEEE80211_RADIOTAP;
          	dev->header_ops = NULL;
          	dev->hard_header_len = 0;
          	dev->netdev_ops = &wonder_netdev_ops;
          	dev->needs_free_netdev = true;
          	dev->priv_flags |= IFF_NO_QUEUE;
          	dev->flags &= ~IFF_MULTICAST;
          }

          static struct wireless_dev *wonder_add_iface(struct wiphy *wiphy, const char *name,
          					     unsigned char name_assign_type,
          					     enum nl80211_iftype type,
          					     struct vif_params *params)
          {
          	struct wireless_dev *wdev;
          	struct net_device *dev;
          	u8 mac[ETH_ALEN];
          	int count = 0;
          	int err;

          	if (type != NL80211_IFTYPE_MONITOR)
          		return ERR_PTR(-EOPNOTSUPP);

          	list_for_each_entry(wdev, &wiphy->wdev_list, list)
          		count++;
          	if (count >= WONDER_MAX_IFACES)
          		return ERR_PTR(-EBUSY);

          	dev = alloc_netdev(sizeof(*wdev), name, name_assign_type, wonder_netdev_setup);
          	if (!dev)
          		return ERR_PTR(-ENOMEM);

          	wonder_get_mac(mac);
          	eth_hw_addr_set(dev, mac);

          	wdev = netdev_priv(dev);
          	wdev->wiphy = wiphy;
          	wdev->iftype = type;
          	wdev->netdev = dev;
          	dev->ieee80211_ptr = wdev;
          	SET_NETDEV_DEV(dev, wiphy_dev(wiphy));

          #ifdef WONDER_WIPHY_MTX
          	err = cfg80211_register_netdevice(dev);
          #else
          	err = register_netdevice(dev);
          #endif
          	if (err) {
          		free_netdev(dev);
          		return ERR_PTR(err);
          	}

          	netif_carrier_on(dev);
          	pr_info("%s up on %s\n", dev->name, wiphy_name(wiphy));
          	return wdev;
          }

          /* caller holds RTNL (and the wiphy mutex on 5.12+) */
          static void wonder_drop_iface(struct wireless_dev *wdev)
          {
          	if (!wdev->netdev)
          		return;
          #ifdef WONDER_WIPHY_MTX
          	cfg80211_unregister_netdevice(wdev->netdev);
          #else
          	unregister_netdevice(wdev->netdev);
          #endif
          }

          static int wonder_del_iface(struct wiphy *wiphy, struct wireless_dev *wdev)
          {
          	wonder_drop_iface(wdev);
          	return 0;
          }

          static int wonder_change_iface(struct wiphy *wiphy, struct net_device *dev,
          			       enum nl80211_iftype type, struct vif_params *params)
          {
          	if (type != NL80211_IFTYPE_MONITOR)
          		return -EOPNOTSUPP;
          	/* cfg80211 WARNs if the driver says ok but iftype didn't follow */
          	dev->ieee80211_ptr->iftype = type;
          	return 0;
          }

          /*
           * 6.13 started passing the netdev to .set_monitor_channel, and android16-6.12
           * carries that change too while android15-6.6 and older don't. A version
           * check gets that wrong (it did: this was keyed on 6.13 and broke on 6.12),
           * so both forms are here and the compiler takes whichever one the ops
           * struct of the tree being built against actually declares.
           */
          static int wonder_monitor_channel(struct cfg80211_chan_def *chandef)
          {
          	pr_debug("monitor channel %u MHz\n", chandef->chan->center_freq);
          	return 0;
          }

          static int wonder_set_monitor_channel(struct wiphy *wiphy,
          				      struct cfg80211_chan_def *chandef)
          {
          	return wonder_monitor_channel(chandef);
          }

          static int wonder_set_monitor_channel_dev(struct wiphy *wiphy,
          					  struct net_device *dev,
          					  struct cfg80211_chan_def *chandef)
          {
          	return wonder_monitor_channel(chandef);
          }

          #define WONDER_SET_MONITOR_CHANNEL					\
          	__builtin_choose_expr(						\
          		__same_type(((struct cfg80211_ops *)0)->set_monitor_channel, \
          			    &wonder_set_monitor_channel_dev),		\
          		wonder_set_monitor_channel_dev, wonder_set_monitor_channel)

          static const struct cfg80211_ops wonder_cfg_ops = {
          	.add_virtual_intf	= wonder_add_iface,
          	.del_virtual_intf	= wonder_del_iface,
          	.change_virtual_intf	= wonder_change_iface,
          	.set_monitor_channel	= WONDER_SET_MONITOR_CHANNEL,
          };

          /* ---- vendor commands -------------------------------------------------- */

          static int wonder_vendor_ack(struct wiphy *wiphy, struct wireless_dev *wdev,
          			     const void *data, int len)
          {
          	/* subcmds 1-4 only configure hardware that isn't there */
          	return 0;
          }

          static int wonder_vendor_get_mac(struct wiphy *wiphy, struct wireless_dev *wdev,
          				 const void *data, int len)
          {
          	struct sk_buff *skb;
          	u8 mac[ETH_ALEN];

          	wonder_get_mac(mac);

          	skb = cfg80211_vendor_cmd_alloc_reply_skb(wiphy, nla_total_size(ETH_ALEN));
          	if (!skb)
          		return -ENOMEM;

          	if (READ_ONCE(mac_reply_fmt) == 1) {
          		if (nla_put(skb, 1, ETH_ALEN, mac)) {
          			kfree_skb(skb);
          			return -EMSGSIZE;
          		}
          	} else {
          		skb_put_data(skb, mac, ETH_ALEN);
          	}

          	return cfg80211_vendor_cmd_reply(skb);
          }

          #define WONDER_VCMD(_sub, _fn) {				\
          	.info	= { .vendor_id = WONDER_OUI, .subcmd = (_sub) },\
          	.doit	= (_fn),					\
          	.policy	= VENDOR_CMD_RAW_DATA,				\
          }

          /*
           * No NEED_WDEV flag: whether mosey_server targets the phy or wonder0
           * isn't documented, and without the flag nl80211 takes either.
           */
          static const struct wiphy_vendor_command wonder_vendor_cmds[] = {
          	WONDER_VCMD(WONDER_SET_FREQ, wonder_vendor_ack),
          	WONDER_VCMD(WONDER_SET_FILTER, wonder_vendor_ack),
          	WONDER_VCMD(WONDER_SET_FIXED_TX_RATE, wonder_vendor_ack),
          	WONDER_VCMD(WONDER_SET_REG, wonder_vendor_ack),
          	WONDER_VCMD(WONDER_GET_IF_MAC_ADDR, wonder_vendor_get_mac),
          };

          /* ---- bands ------------------------------------------------------------ */

          #define CHAN2G(_ch, _freq) { .band = NL80211_BAND_2GHZ, .center_freq = (_freq), \
          			     .hw_value = (_ch), .max_power = 20 }
          #define CHAN5G(_ch, _freq) { .band = NL80211_BAND_5GHZ, .center_freq = (_freq), \
          			     .hw_value = (_ch), .max_power = 20 }

          static struct ieee80211_channel wonder_chan_2g[] = {
          	CHAN2G(1, 2412), CHAN2G(6, 2437), CHAN2G(11, 2462),
          };

          static struct ieee80211_channel wonder_chan_5g[] = {
          	/* ch149/5745 first: the channel Quick Share / mosey (Pixel "blazer") uses */
          	CHAN5G(149, 5745), CHAN5G(153, 5765), CHAN5G(157, 5785), CHAN5G(161, 5805),
          	CHAN5G(36, 5180), CHAN5G(44, 5220),
          };

          static struct ieee80211_rate wonder_rates_2g[] = {
          	{ .bitrate = 10 }, { .bitrate = 20 }, { .bitrate = 55 }, { .bitrate = 110 },
          	{ .bitrate = 60 }, { .bitrate = 120 }, { .bitrate = 240 }, { .bitrate = 540 },
          };

          /* 5 GHz has no CCK, so it gets the OFDM tail of the same table */
          static struct ieee80211_supported_band wonder_band_2g = {
          	.band		= NL80211_BAND_2GHZ,
          	.channels	= wonder_chan_2g,
          	.n_channels	= ARRAY_SIZE(wonder_chan_2g),
          	.bitrates	= wonder_rates_2g,
          	.n_bitrates	= ARRAY_SIZE(wonder_rates_2g),
          };

          static struct ieee80211_supported_band wonder_band_5g = {
          	.band		= NL80211_BAND_5GHZ,
          	.channels	= wonder_chan_5g,
          	.n_channels	= ARRAY_SIZE(wonder_chan_5g),
          	.bitrates	= wonder_rates_2g + 4,
          	.n_bitrates	= ARRAY_SIZE(wonder_rates_2g) - 4,
          };

          /* ---- init / exit ------------------------------------------------------ */

          static int __init wonder_init(void)
          {
          	struct wiphy *wiphy;
          	u8 mac[ETH_ALEN];
          	int err;

          	wiphy = wiphy_new_nm(&wonder_cfg_ops, 0, "wonder");
          	if (!wiphy)
          		return -ENOMEM;

          	wonder_get_mac(mac);
          	ether_addr_copy(wiphy->perm_addr, mac);

          	wiphy->interface_modes = BIT(NL80211_IFTYPE_MONITOR);
          	wiphy->bands[NL80211_BAND_2GHZ] = &wonder_band_2g;
          	wiphy->bands[NL80211_BAND_5GHZ] = &wonder_band_5g;
          	wiphy->signal_type = CFG80211_SIGNAL_TYPE_MBM;
          	wiphy->vendor_commands = wonder_vendor_cmds;
          	wiphy->n_vendor_commands = ARRAY_SIZE(wonder_vendor_cmds);
          	/* mosey may ask for an "active" monitor; nothing here cares either way */
          	wiphy->features |= NL80211_FEATURE_ACTIVE_MONITOR;

          	err = wiphy_register(wiphy);
          	if (err) {
          		pr_err("wiphy_register: %d (is the phy name 'wonder' taken?)\n", err);
          		wiphy_free(wiphy);
          		return err;
          	}

          	wonder_wiphy = wiphy;
          	pr_info("registered %s, mac %pM\n", wiphy_name(wiphy), mac);
          	return 0;
          }

          static void __exit wonder_exit(void)
          {
          	struct wireless_dev *wdev, *tmp;
          	struct wiphy *wiphy = wonder_wiphy;

          	rtnl_lock();
          #ifdef WONDER_WIPHY_MTX
          	wiphy_lock(wiphy);
          #endif
          	list_for_each_entry_safe(wdev, tmp, &wiphy->wdev_list, list)
          		wonder_drop_iface(wdev);
          #ifdef WONDER_WIPHY_MTX
          	wiphy_unlock(wiphy);
          #endif
          	rtnl_unlock();

          	wiphy_unregister(wiphy);
          	wiphy_free(wiphy);
          }

          module_init(wonder_init);
          module_exit(wonder_exit);

          MODULE_LICENSE("GPL");
          MODULE_AUTHOR("Dev_DcS");
          MODULE_DESCRIPTION("Virtual 'wonder' cfg80211 phy for Mosey / Quick Share");
          MODULE_SOFTDEP("pre: cfg80211");
          WONDER_EOF

      - name: Apply shell->su SELinux hide patch (@Dev_DcS)
        if: ${{ inputs.hide_shell_su == true }}
        shell: bash
        run: |
          APPLY="$GITHUB_WORKSPACE/Construction_Site/KernelStuff/selinux_hide_shell_su/apply.sh"
          if [ ! -f "$APPLY" ]; then
            echo "::error::hide_shell_su is on but $APPLY is missing - commit Construction_Site/KernelStuff/selinux_hide_shell_su/"
            exit 1
          fi
          bash "$APPLY" "$GITHUB_WORKSPACE/kernel_workspace/common"

      - name: Configure Kernel (`gki_defconfig` & Kleaf Protected Exports for ${{ matrix.kernel_version }})
        shell: bash
        env:
          CUSTOM_KERNEL_NAME: ${{ inputs.kernel_name }}
        run: |
          cd kernel_workspace/common
          : > .scmversion 2>/dev/null || true
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          set_kconfig() {
            local key="$1"
            local val="$2"
            sed -i "/^${key}=/d" "$DEFCONFIG"
            sed -i "/^# ${key} is not set/d" "$DEFCONFIG"
            if [ "$val" = "n" ]; then
              echo "# ${key} is not set" >> "$DEFCONFIG"
            else
              echo "${key}=${val}" >> "$DEFCONFIG"
            fi
          }

          if [ -f scripts/setlocalversion ]; then
            sed -i 's/-maybe-dirty//g; s/-dirty//g' scripts/setlocalversion
          fi
          sed -i 's/-maybe-dirty//g' ../build/kernel/kleaf/impl/stamp.bzl 2>/dev/null || true
          set_kconfig CONFIG_LOCALVERSION_AUTO n

          if [ -n "${CUSTOM_KERNEL_NAME:-}" ]; then
            KN="$(printf '%s' "$CUSTOM_KERNEL_NAME" | tr -cd 'A-Za-z0-9._-')"
            if [ -n "$KN" ]; then
              set_kconfig CONFIG_LOCALVERSION "\"-$KN\""
              PS_FRAG="../build/kernel/kleaf/impl/defconfig/arm64_16k_defconfig"
              if grep -qs '^CONFIG_LOCALVERSION=' "$PS_FRAG"; then
                sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"-$KN\"/" "$PS_FRAG"
              fi
              echo "[+] Kernel name: -$KN"
            fi
          fi

          set_kconfig CONFIG_WERROR n
          case "${{ inputs.zram_algo }}" in
            zstd)
              set_kconfig CONFIG_CRYPTO_ZSTD y
              set_kconfig CONFIG_ZRAM_DEF_COMP_ZSTD y
              set_kconfig CONFIG_ZRAM_DEF_COMP "\"zstd\""
              echo "[+] ZRAM default compressor: zstd"
              ;;
            *)
              set_kconfig CONFIG_CRYPTO_LZ4 y
              set_kconfig CONFIG_ZRAM_DEF_COMP_LZ4 y
              echo "[+] ZRAM default compressor: lz4 (default)"
              ;;
          esac
          echo "KBUILD_CFLAGS += -Wno-error -Wno-unused-variable -Wno-unused-function -Wno-unused-label -Wno-unused-but-set-variable" >> Makefile

          set_kconfig CONFIG_KSU y
          set_kconfig CONFIG_KALLSYMS_ALL y
          set_kconfig CONFIG_KPROBES y
          if [ "${{ inputs.enable_susfs }}" = "true" ] && [ -f fs/susfs.c ]; then
            set_kconfig CONFIG_KSU_SUSFS y
            set_kconfig CONFIG_KSU_SUSFS_SUS_PATH y
            set_kconfig CONFIG_KSU_SUSFS_SUS_MOUNT y
            set_kconfig CONFIG_KSU_SUSFS_SUS_KSTAT y
            set_kconfig CONFIG_KSU_SUSFS_SPOOF_UNAME y
            set_kconfig CONFIG_KSU_SUSFS_ENABLE_LOG y
            set_kconfig CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
            set_kconfig CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
            set_kconfig CONFIG_KSU_SUSFS_OPEN_REDIRECT y
            set_kconfig CONFIG_KSU_SUSFS_SUS_MAP y
            set_kconfig CONFIG_KSU_HOOK_SUSFS_INLINE y
            set_kconfig CONFIG_KSU_HOOK_TRACEPOINT n
          fi

          if [ "${{ inputs.hide_shell_su }}" = "true" ]; then
            set_kconfig CONFIG_SELINUX_HIDE_SHELL_SU_TRANS y
          fi

          if [ "${{ inputs.metamodule }}" != "none" ]; then
            set_kconfig CONFIG_TMPFS_XATTR y
            set_kconfig CONFIG_TMPFS_POSIX_ACL y
            case "${{ inputs.metamodule }}" in
              Mountify|Hybrid) set_kconfig CONFIG_OVERLAY_FS y ;;
            esac
          fi

          if [ "${{ inputs.enable_droidspaces }}" = "true" ]; then
            set_kconfig CONFIG_PID_NS y
            set_kconfig CONFIG_UTS_NS y
            set_kconfig CONFIG_NET_NS y
            set_kconfig CONFIG_IPC_NS y
            set_kconfig CONFIG_USER_NS y
            set_kconfig CONFIG_SYSVIPC y
            set_kconfig CONFIG_POSIX_MQUEUE y
            set_kconfig CONFIG_DEVTMPFS y
            set_kconfig CONFIG_OVERLAY_FS y
            set_kconfig CONFIG_TMPFS_POSIX_ACL y
            set_kconfig CONFIG_TMPFS_XATTR y
            set_kconfig CONFIG_NETFILTER_XT_MATCH_ADDRTYPE y
            set_kconfig CONFIG_NETFILTER_XT_TARGET_REJECT y
            set_kconfig CONFIG_NETFILTER_XT_TARGET_LOG y
            set_kconfig CONFIG_NETFILTER_XT_MATCH_RECENT y
            set_kconfig CONFIG_IP_SET y
            set_kconfig CONFIG_IP_SET_HASH_IP y
            set_kconfig CONFIG_IP_SET_HASH_NET y
            set_kconfig CONFIG_NETFILTER_XT_SET y
            set_kconfig CONFIG_MACVLAN y
            set_kconfig CONFIG_NF_NAT y
            set_kconfig CONFIG_IP6_NF_NAT y
            set_kconfig CONFIG_IP6_NF_TARGET_MASQUERADE y
            echo "[+] DroidSpaces: PID/UTS/NET/IPC/USER ns + SysV IPC + POSIX MQ + devtmpfs + overlay + netfilter/ipset + macvlan/IPv6-NAT (GKI-ABI-safe set)"
          fi

          if [ "${{ inputs.enable_cgroup_limits }}" = "true" ]; then
            set_kconfig CONFIG_CGROUP_SCHED y
            set_kconfig CONFIG_FAIR_GROUP_SCHED y
            set_kconfig CONFIG_CFS_BANDWIDTH y
            set_kconfig CONFIG_CGROUP_PIDS y
            echo "[!] Container CPU/pids limits: CFS_BANDWIDTH + CGROUP_PIDS ON - these shift GKI ABI structs; the post-build KMI check will fail the build if a Pixel-list symbol CRC moves, and a boot test is required for the rest"
          fi

          if [ "${{ (inputs.net_features == 'both' || inputs.net_features == 'networking') && 'true' || 'false' }}" = "true" ]; then
            set_kconfig CONFIG_WIREGUARD y
            set_kconfig CONFIG_TCP_CONG_ADVANCED y
            set_kconfig CONFIG_TCP_CONG_BBR y
            set_kconfig CONFIG_TCP_CONG_BIC n
            set_kconfig CONFIG_TCP_CONG_WESTWOOD n
            set_kconfig CONFIG_TCP_CONG_HTCP n
            set_kconfig CONFIG_NET_SCH_FQ y
            set_kconfig CONFIG_NET_SCH_CAKE y
            set_kconfig CONFIG_IP_SET y
            set_kconfig CONFIG_IP_SET_MAX 256
            set_kconfig CONFIG_NETFILTER_XT_TARGET_HL y
            set_kconfig CONFIG_NETFILTER_XT_TARGET_CONNMARK y
            if grep -q 'fs/netfs/netfs.ko' modules.bzl 2>/dev/null && \
               grep -q 'select NETFS_SUPPORT' fs/smb/client/Kconfig 2>/dev/null; then
              echo "[i] CIFS left out on ${{ matrix.kernel_version }}: it would turn the GKI module netfs.ko into a built-in"
            else
              set_kconfig CONFIG_CIFS y
            fi
          fi

          if [ "${{ inputs.enable_bpf }}" = "true" ]; then
            set_kconfig CONFIG_BPF_SYSCALL y
            set_kconfig CONFIG_BPF_JIT y
            set_kconfig CONFIG_DEBUG_INFO_BTF y
          fi

          if [ "${{ (inputs.net_features == 'both' || inputs.net_features == 'ntsync') && 'true' || 'false' }}" = "true" ] && [ -f drivers/misc/ntsync.c ]; then
            set_kconfig CONFIG_NTSYNC y
          fi


          sed -i 's/check_defconfig//' build.config.gki* || true
          sed -i 's/TRIM_NONLISTED_KMI=1/TRIM_NONLISTED_KMI=0/g' build.config.gki* || true
          sed -i 's/KMI_SYMBOL_LIST_STRICT_MODE=1/KMI_SYMBOL_LIST_STRICT_MODE=0/g' build.config.gki* || true

          for f in android/abi_gki_protected_exports_*; do
            [ -f "$f" ] && : > "$f"
          done
          for bzl in BUILD.bazel ../build/kernel/kleaf/common_kernels.bzl; do
            if [ -f "$bzl" ]; then
              sed -i 's/trim_nonlisted_kmi = True/trim_nonlisted_kmi = False/g' "$bzl" || true
              sed -i 's/kmi_symbol_list_strict_mode = True/kmi_symbol_list_strict_mode = False/g' "$bzl" || true
            fi
          done

          if [ -f BUILD.bazel ] && grep -q '^common_kernel($' BUILD.bazel; then
            for t in kernel_aarch64 kernel_aarch64_16k; do
              if grep -q "^    name = \"$t\",\$" BUILD.bazel && \
                 ! sed -n "/^    name = \"$t\",\$/,/^)/p" BUILD.bazel | grep -q 'check_defconfig'; then
                sed -i "/^    name = \"$t\",\$/a\\    check_defconfig = \"disabled\"," BUILD.bazel
                echo "[+] Kleaf defconfig check disabled for $t"
              fi
            done
          fi
          KLEAF_CK="../build/kernel/kleaf/common_kernels.bzl"
          if [ -f "$KLEAF_CK" ]; then
            sed -i 's/"match" if pre_defconfig_fragments else "minimized"/"disabled"/' "$KLEAF_CK" || true
          fi


      - name: Compile Kernel (${{ matrix.kernel_version }} - Auto Bazel / build.sh Dispatch)
        shell: bash
        run: |
          cd kernel_workspace
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace/out/dist"

          if [ "${{ matrix.build_tool }}" = "bazel" ] || { [ "${{ matrix.build_tool }}" = "auto" ] && [ -x tools/bazel ]; }; then
            echo "[+] Building ${{ matrix.kernel_version }} with Kleaf / Bazel (page_size=${{ inputs.page_size }})..."
            KTARGET="kernel_aarch64"
            if [ "${{ inputs.page_size }}" = "16k" ]; then
              if grep -qs '"kernel_aarch64_16k"' common/BUILD.bazel build/kernel/kleaf/common_kernels.bzl; then
                KTARGET="kernel_aarch64_16k"
              else
                echo "::error::page_size=16k: this tree has no kernel_aarch64_16k target, and a 4k kernel under a 16k label won't boot"
                exit 1
              fi
            fi
            echo "KTARGET=$KTARGET" >> "$GITHUB_ENV"
            BAZEL_TARGET="//common:${KTARGET}_dist"
            DIST_OUT="$GITHUB_WORKSPACE/kernel_workspace/out/dist"
            if grep -q 'pkg_install' build/kernel/kleaf/common_kernels.bzl 2>/dev/null; then
              DIST_FLAG="--destdir=$DIST_OUT"
            else
              DIST_FLAG="--dist_dir=$DIST_OUT"
            fi
            tools/bazel run --config=fast --verbose_failures "${BAZEL_TARGET}" -- "$DIST_FLAG"
          else
            if [ "${{ inputs.page_size }}" = "16k" ]; then
              echo "::error::page_size=16k needs the Kleaf build; build.sh here only does the default 4k config"
              exit 1
            fi
            echo "[+] Building ${{ matrix.kernel_version }} with legacy build/build.sh + ccache..."
            export CCACHE_DIR="$HOME/.cache/ccache"
            export USE_CCACHE=1
            ccache -M 12G || true
            LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 DIST_DIR="$GITHUB_WORKSPACE/kernel_workspace/out/dist" build/build.sh
          fi

          IMG="out/dist/Image"
          [ -f "$IMG" ] || IMG="bazel-bin/common/${KTARGET:-kernel_aarch64}/Image"
          if [ -f "$IMG" ] && [ "$(od -An -tx4 -j56 -N4 "$IMG" | tr -d ' ')" = "644d5241" ]; then
            case $(( ($(od -An -tu8 -j24 -N8 "$IMG" | tr -d ' ') >> 1) & 3 )) in
              1) BUILT_PS=4k ;; 2) BUILT_PS=16k ;; 3) BUILT_PS=64k ;; *) BUILT_PS="" ;;
            esac
            if [ -n "$BUILT_PS" ]; then
              echo "[i] Image page size: $BUILT_PS"
              if [ "$BUILT_PS" != "${{ inputs.page_size }}" ]; then
                echo "::error::asked for ${{ inputs.page_size }} pages but the Image that came out is $BUILT_PS"
                exit 1
              fi
            fi
          fi

      - name: KMI check against Google's own build (@Dev_DcS)
        shell: bash
        working-directory: ${{ github.workspace }}/kernel_workspace
        run: |
          set -uo pipefail
          TARGET="${KTARGET:-kernel_aarch64}"
          REF="${{ matrix.kmi_ref_branch }}"
          MINE="$(find out/dist "bazel-bin/common/$TARGET" -maxdepth 2 -name vmlinux.symvers 2>/dev/null | head -n1 || true)"
          if [ -z "$MINE" ]; then
            echo "::warning::no vmlinux.symvers in the build output - KMI not cross-checked"
            exit 0
          fi
          if [ -z "$REF" ]; then
            echo "::warning::Google publishes no build to compare ${{ matrix.gki_branch }} with - KMI not cross-checked"
            exit 0
          fi

          CI="https://ci.android.com/builds"
          BID="$(curl -fsSL --retry 3 --max-time 60 "$CI/branches/aosp_kernel-common-${REF}/status.json" \
                   | python3 -c 'import json, sys; print(next(t["last_known_good_build"] for t in json.load(sys.stdin)["targets"] if t["name"] == sys.argv[1]))' "$TARGET" 2>/dev/null || true)"
          THEIRS="$RUNNER_TEMP/google.symvers"
          if [ -z "$BID" ] || ! curl -fsSL --retry 3 --max-time 300 -o "$THEIRS" "$CI/submitted/$BID/$TARGET/latest/raw/vmlinux.symvers"; then
            echo "::warning::could not fetch Google's vmlinux.symvers for $REF - KMI not cross-checked"
            exit 0
          fi

          LIST="common/gki/aarch64/symbols/pixel"
          [ -f "$LIST" ] || LIST="common/android/abi_gki_aarch64_pixel"
          rc=0
          python3 - "$MINE" "$THEIRS" "$LIST" "$REF" "$BID" <<'PY' || rc=$?
          import sys

          def crcs(path):
              out = {}
              with open(path) as f:
                  for line in f:
                      col = line.rstrip("\n").split("\t")
                      if len(col) >= 2 and col[0].startswith("0x"):
                          out[col[1]] = col[0]
              return out

          mine, theirs = crcs(sys.argv[1]), crcs(sys.argv[2])
          ref, bid = sys.argv[4], sys.argv[5]
          if len(mine) < 1000 or len(theirs) < 1000:
              print(f"::warning::symbol lists look wrong (ours {len(mine)}, Google's {len(theirs)}) - KMI not cross-checked")
              sys.exit(0)
          try:
              with open(sys.argv[3]) as f:
                  pixel = {l.strip() for l in f if l.strip() and not l.lstrip().startswith(("[", "#"))}
          except OSError:
              pixel = set()

          changed = sorted(s for s in theirs if s in mine and mine[s] != theirs[s])
          missing = sorted(s for s in theirs if s not in mine)
          hits = [s for s in changed + missing if not pixel or s in pixel]

          print(f"[i] compared with Google's {ref} build {bid}: {len(theirs)} exported symbols, "
                f"{len(changed)} with a different CRC, {len(missing)} not exported here")
          for s in (changed + missing)[:40]:
              print(f"      {'CRC ' if s in mine else 'gone'}  {s}{'   <- Pixel list' if s in pixel else ''}")
          if hits:
              print(f"KMI_HITS={len(hits)} e.g. {', '.join(hits[:6])}")
              sys.exit(3)
          scope = f"all {len(pixel & theirs.keys())} Pixel-list symbols" if pixel else "every exported symbol"
          print(f"[+] KMI intact: {scope} match Google's build")
          PY
          if [ "$rc" -eq 3 ]; then
            MSG="symbols the Pixel drivers import do not match Google's $REF build (list above); modules using them will not load"
            if [ "${{ matrix.kmi_ref_exact }}" = "true" ] && [ "${{ inputs.allow_version_mismatch }}" != "true" ]; then
              echo "::error::KMI broken: $MSG. Something in this build changed the ABI - not packaging a kernel that would loop at boot."
              exit 1
            fi
            echo "::warning::KMI differs: $MSG."
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::KMI comparison did not run to the end (rc=$rc)"
          fi

      - name: Build & Package Mosey wonder KSU Module (out-of-tree `.ko`)
        id: mosey
        if: ${{ inputs.mosey_mode != 'disabled' }}
        continue-on-error: true
        working-directory: ${{ github.workspace }}/kernel_workspace
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/mosey_src"
          OBJ="$RUNNER_TEMP/mosey_kobj"; rm -rf "$OBJ"; mkdir -p "$OBJ"

          cfg=""
          for c in bazel-bin/common/${KTARGET:-kernel_aarch64}_config/out_dir/.config out/dist/.config out/.config; do
            [ -f "$c" ] && { cfg="$c"; break; }
          done
          [ -n "$cfg" ] || cfg="$(find bazel-bin/common out -maxdepth 4 -name .config -type f 2>/dev/null | head -n1 || true)"
          img=""
          for i in out/dist/Image bazel-bin/common/${KTARGET:-kernel_aarch64}/Image; do
            [ -f "$i" ] && { img="$i"; break; }
          done
          [ -n "$img" ] || img="$(find . -maxdepth 5 -type f -name Image 2>/dev/null | head -n1 || true)"
          if [ -z "$cfg" ] || [ -z "$img" ]; then
            echo "::warning::Mosey: no .config/Image found for this family, skipping module (kernel zip unaffected)"
            exit 0
          fi

          krel="$(strings -n 16 "$img" | sed -n 's/^Linux version \([0-9][^ ]*\) .*/\1/p' | head -n1)"
          [ -n "$krel" ] || krel="${{ steps.sync-kernel.outputs.resolved_kver }}"

          clang_ver="$(sed -n 's/^CLANG_VERSION=//p' common/build.config.constants 2>/dev/null | head -n1 || true)"
          clang_bin="$(sed -n 's/^CLANG_PREBUILT_BIN=//p' common/build.config.common 2>/dev/null | head -n1 || true)"
          clang_bin="${clang_bin//\$\{CLANG_VERSION\}/$clang_ver}"
          if [ ! -x "$clang_bin/clang" ] && [ -n "$clang_ver" ]; then
            clang_bin="prebuilts/clang/host/linux-x86/clang-${clang_ver}/bin"
          fi
          if [ ! -x "$clang_bin/clang" ]; then
            clang_bin="$(find prebuilts*/clang/host/linux-x86 -maxdepth 2 -path '*/clang-r*/bin' -type d 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$clang_bin" ] || [ ! -x "$clang_bin/clang" ]; then
            echo "::warning::Mosey: no prebuilt clang found, skipping module (kernel zip unaffected)"
            exit 0
          fi
          export PATH="$PWD/$clang_bin:$PATH"

          cp "$cfg" "$OBJ/.config"
          if [ -f common/scripts/config ]; then
            common/scripts/config --file "$OBJ/.config" --disable RUST --disable TRIM_UNUSED_KSYMS || true
          fi

          mk=(make -C common O="$OBJ" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
              LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ -j"$(nproc)")
          "${mk[@]}" olddefconfig
          "${mk[@]}" modules_prepare
          echo "$krel" > "$OBJ/include/config/kernel.release"
          printf '#define UTS_RELEASE "%s"\n' "$krel" > "$OBJ/include/generated/utsrelease.h"

          sv="$(find "bazel-bin/common/${KTARGET:-kernel_aarch64}" out -maxdepth 3 \( -name vmlinux.symvers -o -name Module.symvers \) -type f 2>/dev/null | head -n1 || true)"
          if [ -n "$sv" ]; then cp "$sv" "$OBJ/Module.symvers"; else echo "::warning::Mosey: no symvers, core symbols unversioned"; fi

          "${mk[@]}" M="$SRC" KBUILD_MODPOST_WARN=1 modules
          ko="$SRC/wonder_mosey_wild.ko"
          llvm-strip --strip-debug "$ko" || true
          vermagic="$(modinfo -F vermagic "$ko" 2>/dev/null || echo '?')"
          echo "[+] built wonder_mosey_wild.ko  vermagic: $vermagic"
          case "$vermagic" in
            "$krel "*) ;;
            *) echo "::warning::Mosey: vermagic '$vermagic' does not start with $krel" ;;
          esac

          ENABLER="$GITHUB_WORKSPACE/mosey/enabler"
          PKG="$GITHUB_WORKSPACE/mosey_wonder/pkg"
          rm -rf "$GITHUB_WORKSPACE/mosey_wonder"; mkdir -p "$PKG"
          if [ -d "$ENABLER" ]; then
            echo "[+] Baking wonder_mosey_wild.ko into the full Mosey enabler module"
            cp -a "$ENABLER/." "$PKG/"
            rm -f "$PKG/NOTICE-wonder.md"
            MODNAME="Mosey-enabler"
            if [ -f "$ENABLER/blobs.manifest" ]; then
              MOSEY_SHIM_BASE="${{ vars.MOSEY_SHIM_BASE }}" bash "$GITHUB_WORKSPACE/tools/fetch-blobs.sh" "$ENABLER/blobs.manifest" "$PKG" \
                || echo "::warning::Mosey enabler: blob fetch reported errors; the shim may be absent from the zip. Set the MOSEY_SHIM_BASE repo variable to where you host the GPLv2 shim APKs."
              rm -f "$PKG/blobs.manifest"
            fi
            for a in system_ext/priv-app/MoseyBridgeShim/MoseyBridgeShim.apk payload/MoseyBridgeShim.apk; do
              [ -s "$PKG/$a" ] || echo "::warning::Mosey enabler: $a missing from the zip - fetch-blobs couldn't place it (check the MOSEY_SHIM_BASE repo variable and the manifest URLs). customize.sh will flag it on-device."
            done
          else
            echo "[+] No mosey/enabler in repo; shipping the minimal wonder loader module"
            mkdir -p "$PKG/META-INF/com/google/android"
            cat > "$PKG/module.prop" <<'PROP_EOF'
          id=mosey_wonder
          name=Mosey wonder phy
          version=@KREL@
          versionCode=@VCODE@
          author=@Dev_DcS
          description=Loads wonder_mosey_wild.ko so mosey-extended gets its 'wonder' phy. Only loads on the kernel it was built with: @KREL@
          PROP_EOF
            cat > "$PKG/post-fs-data.sh" <<'PFD_EOF'
          #!/system/bin/sh
          MODDIR=${0%/*}
          LOG="$MODDIR/wonder.log"

          [ -d /sys/module/wonder_mosey_wild ] && exit 0

          (
            i=0
            while [ ! -d /sys/module/cfg80211 ] && [ "$i" -lt 120 ]; do
              sleep 1
              i=$((i + 1))
            done
            if [ ! -d /sys/module/cfg80211 ]; then
              echo "cfg80211 never showed up after ${i}s, not loading" > "$LOG"
              exit 0
            fi
            KO="$MODDIR/wonder_mosey_wild.ko"
            if [ -s "$MODDIR/mac_addr" ]; then
              set -- "$KO" "mac_addr=$(head -n1 "$MODDIR/mac_addr")"
            else
              set -- "$KO"
            fi
            if insmod "$@" > "$LOG" 2>&1; then
              echo "loaded after ${i}s on $(uname -r)" >> "$LOG"
            else
              echo "insmod failed on $(uname -r), see dmesg | grep wonder" >> "$LOG"
            fi
          ) &
          PFD_EOF
            cat > "$PKG/customize.sh" <<'CUST_EOF'
          BUILT_FOR="@KREL@"
          RUNNING="$(uname -r)"

          ui_print "- wonder_mosey_wild for $BUILT_FOR"
          if [ "$RUNNING" != "$BUILT_FOR" ]; then
            ui_print "! Running kernel is $RUNNING"
            ui_print "! The module will very likely be refused until you"
            ui_print "! flash the matching Wild kernel from the same run."
          fi
          if [ ! -d /sys/module/cfg80211 ]; then
            ui_print "! cfg80211 isn't loaded right now. It normally comes"
            ui_print "! with the Wi-Fi driver, the phy loads once it is."
          fi
          ui_print "- MAC: $(head -n1 "$MODPATH/mac_addr" 2>/dev/null)"
          ui_print "  change it in /data/adb/modules/mosey_wonder/mac_addr"
          CUST_EOF
            cat > "$PKG/META-INF/com/google/android/update-binary" <<'UB_EOF'
          #!/sbin/sh

          umask 022

          ui_print() { echo "$1"; }

          # read by util_functions.sh's install_module
          # shellcheck disable=SC2034
          OUTFD=$2
          # shellcheck disable=SC2034
          ZIPFILE=$3

          mount /data 2>/dev/null

          if [ ! -f /data/adb/magisk/util_functions.sh ]; then
            ui_print "Install this from the KernelSU or Magisk app."
            exit 1
          fi
          . /data/adb/magisk/util_functions.sh
          install_module
          exit 0
          UB_EOF
            echo '#MAGISK' > "$PKG/META-INF/com/google/android/updater-script"
            sed -i -e "s|@KREL@|$krel|g" -e "s|@VCODE@|${GITHUB_RUN_NUMBER}|g" "$PKG/module.prop" "$PKG/customize.sh"
            MODNAME="Mosey-wonder"
          fi

          cp "$ko" "$PKG/wonder_mosey_wild.ko"
          echo "${{ inputs.mosey_mac_addr }}" > "$PKG/mac_addr"
          for s in post-fs-data.sh wonder-load.sh service.sh post-mount.sh boot-completed.sh                    customize.sh uninstall.sh action.sh mosey-control.sh                    META-INF/com/google/android/update-binary; do
            [ -f "$PKG/$s" ] && chmod 0755 "$PKG/$s"
          done

          ZIP="$GITHUB_WORKSPACE/${krel}-${{ matrix.kernel_version }}-${{ matrix.root_variant }}-${MODNAME}.zip"
          (cd "$PKG" && zip -qr9 "$ZIP" .)
          echo "built=1" >> "$GITHUB_OUTPUT"
          unzip -l "$ZIP" | tail -25

      - name: Upload Mosey module
        if: ${{ inputs.mosey_mode != 'disabled' && steps.mosey.outputs.built == '1' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}-${{ matrix.root_variant }}-Mosey"
          path: |
            *-Mosey-enabler.zip
            *-Mosey-wonder.zip
          if-no-files-found: ignore

      - name: Package Flashable AnyKernel3 Archive & BuildInfo
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git AnyKernel3 || \
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          if [ -f kernel_workspace/out/dist/Image ]; then
            cp -f kernel_workspace/out/dist/Image AnyKernel3/Image
          elif [ -f kernel_workspace/bazel-bin/common/${KTARGET:-kernel_aarch64}/Image ]; then
            cp -f kernel_workspace/bazel-bin/common/${KTARGET:-kernel_aarch64}/Image AnyKernel3/Image
          else
            FOUND_IMG=$(find kernel_workspace -type f -name "Image" | head -n 1 || true)
            if [ -n "$FOUND_IMG" ]; then
              cp -f "$FOUND_IMG" AnyKernel3/Image
            fi
          fi

          if [ ! -f AnyKernel3/Image ]; then
            echo "[-] Error: Compiled kernel Image not found!"
            exit 1
          fi

          KMI_TAG="${{ steps.sync-kernel.outputs.kmi_tag }}"
          cat > AnyKernel3/tools/kmi-guard.sh <<'GUARD_EOF'
          # KMI / page-size guard, sourced by anykernel.sh right after ak3-core.sh.
          #
          # The kernel running right now is the one this phone's vendor modules
          # match. If this Image is another KMI generation (the "android16-6" in
          # uname -r) or another page size, those modules will not load and the
          # phone loops at boot - so say so and stop while nothing is written yet.
          #   -- @Dev_DcS
          zip_kmi="@KMI@"
          zip_page="@PAGE@"

          run_rel="$(uname -r)"
          run_kmi="$(echo "$run_rel" | grep -o 'android[0-9][0-9]*-[0-9][0-9]*' | head -n1)"
          case "$(awk '/^KernelPageSize:/ { print $2; exit }' /proc/self/smaps 2>/dev/null)" in
            4)  run_page=4k ;;
            16) run_page=16k ;;
            *)  run_page="" ;;
          esac

          ui_print " " "  -> This zip:    KMI ${zip_kmi:-unknown}, $zip_page pages"
          ui_print "  -> Running now: KMI ${run_kmi:-unknown}, ${run_page:-unknown} pages"

          if [ -e /data/local/tmp/kmi_guard_off ]; then
            ui_print "  -> /data/local/tmp/kmi_guard_off is there, not checking"
          elif [ -n "$zip_kmi" ] && [ -n "$run_kmi" ] && [ "$run_kmi" != "$zip_kmi" ]; then
            abort "  -> Wrong KMI generation for this phone ($run_rel)." \
                  "     Its drivers are built for $run_kmi and will not load on $zip_kmi:" \
                  "     that is a bootloop, so nothing was flashed." \
                  "     Build ${run_kmi%-*}-$(echo "$run_rel" | cut -d. -f1,2) with kmi_generation=${run_kmi##*-} instead."
          elif [ -n "$run_page" ] && [ "$run_page" != "$zip_page" ]; then
            abort "  -> Wrong page size for this phone." \
                  "     It runs $run_page pages, this kernel is built for $zip_page:" \
                  "     that is a bootloop, so nothing was flashed." \
                  "     Build again with page_size=$run_page."
          fi
          GUARD_EOF
          sed -i "s/@KMI@/${KMI_TAG}/; s/@PAGE@/${{ inputs.page_size }}/" AnyKernel3/tools/kmi-guard.sh
          if grep -q '^\. tools/ak3-core\.sh' AnyKernel3/anykernel.sh; then
            sed -i '/^\. tools\/ak3-core\.sh/a . $AKHOME/tools/kmi-guard.sh' AnyKernel3/anykernel.sh
            echo "[+] flash guard in place: KMI ${KMI_TAG:-unknown}, ${{ inputs.page_size }} pages"
          else
            echo "::warning::anykernel.sh has a layout this step does not know - the zip has no KMI / page-size guard"
          fi

          KVER_FULL="${{ steps.sync-kernel.outputs.resolved_kver }}"
          PS_TAG=""
          [ "${{ inputs.page_size }}" = "16k" ] && PS_TAG="-16k"
          ZIP_NAME="${KVER_FULL}-${{ matrix.kernel_version }}${PS_TAG}-${{ matrix.root_variant }}-Mosey-AnyKernel3.zip"
          (cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" .)

          cat << EOF > BuildInfo.txt
          Kernel Family: ${{ matrix.kernel_version }}
          Resolved Kernel Version: ${KVER_FULL}
          Page Size: ${{ inputs.page_size }}
          KMI: ${KMI_TAG} (flash only on a phone whose stock uname -r shows the same)
          Manifest Branch: ${{ matrix.manifest_branch }}
          SUSFS Branch: ${{ matrix.susfs_branch }} (Enabled: ${{ inputs.enable_susfs }})
          Root Implementation: ${{ matrix.root_variant }}
          Metamodule: ${{ inputs.metamodule }}
          Partition Guards: bbg+nv (always on)
          Networking Suite: ${{ (inputs.net_features == 'both' || inputs.net_features == 'networking') && 'true' || 'false' }}
          Extended BPF/BTF: ${{ inputs.enable_bpf }}
          NTSync (/dev/ntsync): ${{ (inputs.net_features == 'both' || inputs.net_features == 'ntsync') && 'true' || 'false' }}
          DroidSpaces-OSS: ${{ inputs.enable_droidspaces }}
          Mosey Extended Mode: ${{ inputs.mosey_mode }} (MAC: ${{ inputs.mosey_mac_addr }})
          NLMON Capture: ${{ inputs.enable_nlmon }}
          Module Check Bypass: ${{ inputs.allow_version_mismatch }}
          EOF

      - name: Upload AnyKernel3 ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}${{ inputs.page_size == '16k' && '-16k' || '' }}-${{ matrix.root_variant }}-Mosey-AnyKernel3"
          path: "*-AnyKernel3.zip"

      - name: Upload BuildInfo & Mosey Companion Bundle
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}-${{ matrix.root_variant }}-Mosey-BuildInfo"
          path: |
            BuildInfo.txt
            mosey_out/*

      - name: Fetch matching root manager APK (${{ matrix.root_variant }})
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p managers
          case "${{ matrix.root_variant }}" in
            FinaSU)        MGR_REPO="LyraVoid/FinaSU" ;;
            KernelSU-Next) MGR_REPO="KernelSU-Next/KernelSU-Next" ;;
            KernelSU)      MGR_REPO="tiann/KernelSU" ;;
            SukiSU-Ultra)  MGR_REPO="SukiSU-Ultra/SukiSU-Ultra" ;;
            BakaSU)        MGR_REPO="Baka-SU/BakaSU" ;;
            KowSU)         MGR_REPO="KOWX712/KernelSU" ;;
            *)             MGR_REPO="" ;;
          esac
          if [ -z "$MGR_REPO" ]; then
            echo "[i] ${{ matrix.root_variant }}: no manager app to fetch"
            exit 0
          fi
          echo "[+] Fetching manager APK from $MGR_REPO (latest release)..."
          if gh release download --repo "$MGR_REPO" --pattern '*.apk' --dir managers 2>/dev/null; then
            echo "[+] manager APK(s): $(ls managers 2>/dev/null | tr '\n' ' ')"
          else
            echo "::warning::no .apk in $MGR_REPO latest release (or repo unavailable); install the $MGR_REPO manager by hand"
          fi

      - name: Upload Root Manager APK
        if: hashFiles('managers/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}-${{ matrix.root_variant }}-Manager"
          path: managers/*.apk

      - name: Fetch metamodule (${{ inputs.metamodule }})
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p metamodule_out
          case "${{ inputs.metamodule }}" in
            NoMount)        META_REPO="maxsteeel/nomount" ;;
            ZeroMount)      META_REPO="Enginex0/zeromount" ;;
            Mountify)       META_REPO="backslashxx/mountify" ;;
            Hybrid)         META_REPO="Hybrid-Mount/meta-hybrid_mount" ;;
            Magic-Mount-rs) META_REPO="Tools-cx-app/meta-magic_mount-rs" ;;
            *)              META_REPO="" ;;
          esac
          [ -z "$META_REPO" ] && { echo "[i] no metamodule to fetch"; exit 0; }
          echo "[+] Fetching ${{ inputs.metamodule }} module ($META_REPO, latest release)..."
          if gh release download --repo "$META_REPO" --pattern '*.zip' --dir metamodule_out 2>/dev/null; then
            echo "[+] metamodule zip(s): $(ls metamodule_out 2>/dev/null | tr '\n' ' ')"
          else
            echo "::warning::could not fetch $META_REPO (no zip asset or repo unavailable); install the metamodule by hand"
          fi

      - name: Upload metamodule
        if: ${{ hashFiles('metamodule_out/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}-${{ matrix.root_variant }}-${{ inputs.metamodule }}"
          path: metamodule_out/*

      - name: Build Re-Kernel module (out-of-tree, experimental, @Dev_DcS)
        if: ${{ inputs.enable_rekernel == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          cd kernel_workspace
          REK_SRC="$GITHUB_WORKSPACE/sources/rekernel/LKM-Source"
          LOADER="$GITHUB_WORKSPACE/sources/rekernel/loader"
          if [ ! -f "$REK_SRC/Makefile" ]; then echo "::warning::Re-Kernel: vendored source missing, skipping (kernel zip unaffected)"; exit 0; fi
          OBJ="$RUNNER_TEMP/rek_kobj"; rm -rf "$OBJ"; mkdir -p "$OBJ"
          REK="$GITHUB_WORKSPACE/rekernel_build"; rm -rf "$REK"; mkdir -p "$REK"; cp -a "$REK_SRC/." "$REK/"
          cfg=""; for c in bazel-bin/common/${KTARGET:-kernel_aarch64}_config/out_dir/.config out/dist/.config out/.config; do [ -f "$c" ] && cfg="$c" && break; done
          [ -n "$cfg" ] || cfg="$(find . -maxdepth 5 -type f -name .config 2>/dev/null | head -n1 || true)"
          img=""; for i in out/dist/Image bazel-bin/common/${KTARGET:-kernel_aarch64}/Image; do [ -f "$i" ] && img="$i" && break; done
          [ -n "$img" ] || img="$(find . -maxdepth 5 -type f -name Image 2>/dev/null | head -n1 || true)"
          if [ -z "$cfg" ] || [ -z "$img" ]; then echo "::warning::Re-Kernel: no .config/Image, skipping (kernel zip unaffected)"; exit 0; fi
          krel="$(strings -n 16 "$img" | sed -n 's/^Linux version \([0-9][^ ]*\) .*/\1/p' | head -n1)"; [ -n "$krel" ] || krel="${{ steps.sync-kernel.outputs.resolved_kver }}"
          clang_ver="$(sed -n 's/^CLANG_VERSION=//p' common/build.config.constants 2>/dev/null | head -n1 || true)"
          clang_bin="$(sed -n 's/^CLANG_PREBUILT_BIN=//p' common/build.config.common 2>/dev/null | head -n1 || true)"
          clang_bin="${clang_bin//\$\{CLANG_VERSION\}/$clang_ver}"
          [ -x "$clang_bin/clang" ] || clang_bin="prebuilts/clang/host/linux-x86/clang-${clang_ver}/bin"
          [ -x "$clang_bin/clang" ] || clang_bin="$(find prebuilts*/clang/host/linux-x86 -maxdepth 2 -path '*/clang-r*/bin' -type d 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$clang_bin" ] || [ ! -x "$clang_bin/clang" ]; then echo "::warning::Re-Kernel: no prebuilt clang, skipping"; exit 0; fi
          export PATH="$PWD/$clang_bin:$PATH"
          cp "$cfg" "$OBJ/.config"
          if [ -f common/scripts/config ]; then
            common/scripts/config --file "$OBJ/.config" --disable RUST --disable TRIM_UNUSED_KSYMS || true
          fi
          mk=(make -C common O="$OBJ" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ -j"$(nproc)")
          "${mk[@]}" olddefconfig || { echo "::warning::Re-Kernel: olddefconfig failed, skipping"; exit 0; }
          "${mk[@]}" modules_prepare || { echo "::warning::Re-Kernel: modules_prepare failed, skipping"; exit 0; }
          echo "$krel" > "$OBJ/include/config/kernel.release"
          printf '#define UTS_RELEASE "%s"\n' "$krel" > "$OBJ/include/generated/utsrelease.h"
          sv="$(find "bazel-bin/common/${KTARGET:-kernel_aarch64}" out -maxdepth 3 \( -name vmlinux.symvers -o -name Module.symvers \) -type f 2>/dev/null | head -n1 || true)"
          [ -n "$sv" ] && cp "$sv" "$OBJ/Module.symvers" || echo "::warning::Re-Kernel: no symvers, core symbols unversioned"
          if ! "${mk[@]}" M="$REK" KBUILD_MODPOST_WARN=1 modules; then echo "::warning::Re-Kernel: module build failed (vendor-hook mismatch on this KMI?); skipping, kernel zip unaffected"; exit 0; fi
          ko="$(find "$REK" -name 'rekernel*.ko' -type f | head -n1 || true)"
          [ -n "$ko" ] || { echo "::warning::Re-Kernel: no .ko produced, skipping"; exit 0; }
          llvm-strip --strip-debug "$ko" 2>/dev/null || true
          echo "[+] built $(basename "$ko")  vermagic: $(modinfo -F vermagic "$ko" 2>/dev/null || echo '?')"
          PKG="$GITHUB_WORKSPACE/rekernel_pkg"; rm -rf "$PKG"; mkdir -p "$PKG"
          cp -a "$LOADER/." "$PKG/"
          cp "$ko" "$PKG/rekernel-${krel}.ko"
          sed -i "s|@KREL@|${krel}|g; s|@VC@|$(date +%Y%m%d)|g" "$PKG/module.prop.in"
          mv "$PKG/module.prop.in" "$PKG/module.prop"
          ZIP="$GITHUB_WORKSPACE/Re-Kernel-${krel}-DevDcS.zip"
          (cd "$PKG" && zip -rqX "$ZIP" .)
          echo "[+] packaged $(basename "$ZIP")"

      - name: Upload Re-Kernel module
        if: ${{ inputs.enable_rekernel == 'true' && hashFiles('Re-Kernel-*-DevDcS.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}-Re-Kernel"
          path: Re-Kernel-*-DevDcS.zip

      - name: Fetch & bundle Integrity Tools (Integrity_Tools.zip)
        if: ${{ inputs.integrity_bundle == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          chmod +x scripts/fetch_integrity_tools.sh 2>/dev/null || true
          if ! bash scripts/fetch_integrity_tools.sh "$GITHUB_WORKSPACE/Integrity_Tools" "$GITHUB_WORKSPACE"; then
            echo "::warning::Integrity tools fetch failed (kernel zip unaffected)"; exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          rm -f Integrity_Tools.zip
          zip -rqX Integrity_Tools.zip Integrity_Tools || true

      - name: Upload Integrity_Tools.zip
        if: ${{ inputs.integrity_bundle == 'true' && hashFiles('Integrity_Tools.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Integrity_Tools
          path: Integrity_Tools.zip
