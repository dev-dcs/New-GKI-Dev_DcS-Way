name: Build FolkPatch for Pixel 10 (stock GKI + KernelPatch/APatch + SUSFS-KPM + Integrity)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # --- Core Kernel & Matrix Selection (All WildKernels Families) ---
      kernel_build_version:
        description: "Kernel Version Family (select 'all' to build 6.1 / 6.6 / 6.12 in parallel)"
        type: choice
        options:
          - android15-6.6
          - android14-6.1
          - android16-6.12
          - all
        default: android15-6.6
      gki_lts_version:
        description: "LTS sublevel ONLY - the last 2-3 digits (e.g. 144 for 6.6.144). The x.y prefix comes from the Kernel Version Family above. Blank = latest LTS for that family."
        type: string
        default: "144"
      kernel_name:
        description: "Custom kernel name for uname (e.g. Dev_DcS) - replaces the -maybe-dirty marker. Letters/digits/._- only. Blank = stock."
        type: string
        default: ""
      page_size:
        description: "ARM64 page size - keep 4k unless your Pixel 10 runs 16KB pages (check: getconf PAGE_SIZE). Wrong value won't boot."
        type: choice
        options:
          - 4k
          - 16k
        default: 4k
      release_type:
        description: "Release Type"
        type: choice
        options:
          - CI
          - Pre-Release
          - Release
        default: CI
      use_cache:
        description: "Use ccache (5.10/5.15) & Bazel cache (5.15+/6.x) (restore/save)"
        type: boolean
        default: true
      allow_version_mismatch:
        description: "Module Check Bypass (force check_version() to pass on mismatched module CRCs)"
        type: boolean
        default: false

      # --- Regular WildKernels Feature Set Toggles ---
      enable_susfs:
        description: "Lay down the SUSFS fs-side sources (susfs4ksu 50_add). On a stock FolkPatch kernel these stay INERT - CONFIG_KSU_SUSFS has no Kconfig without a KSU driver, so fs/susfs.c isn't compiled - but the implementation is present in-tree for a future SUSFS KPM / the FolkPatch app to drive. Live mount hiding today comes from NoMount. Leave ON to ship the sources; OFF to build fully clean."
        type: boolean
        default: true
      enable_nomount:
        description: "Enable NoMount / Mountify Metamodule Support + TMPFS xattr & POSIX ACLs"
        type: boolean
        default: true
      security_patches:
        description: "Security patch level: monthly = latest tagged GKI/LTS (Google monthly, tested); latest-cve = also apply post-release stable CVE fixes on top (bleeding edge, may skip on conflict - READ THE README WARNING); none = base as pinned"
        type: choice
        options:
          - monthly
          - latest-cve
          - none
        default: monthly
      net_features:
        description: "Advanced Networking (WireGuard, BBRv3/BBR, IPSet, TTL/HL Target, CAKE, CIFS/SMB) + NTSync (/dev/ntsync). 'both' (default), 'networking' or 'ntsync' for one, 'none' for neither."
        type: choice
        options:
          - both
          - networking
          - ntsync
          - none
        default: both
      enable_bpf:
        description: "Enable Extended BPF (BTF, eBPF, FUSE-BPF)"
        type: boolean
        default: true
      enable_droidspaces:
        description: "Enable DroidSpaces-OSS Container Runtime Configs & Patches"
        type: boolean
        default: true
      enable_performance:
        description: "Enable WildKernels Performance Tuning & Compression Patches (LZ4/ZSTD)"
        type: boolean
        default: true

      # --- Integrity / extra kernel features (@Dev_DcS) ---
      integrity_bundle:
        description: "Also fetch the newest integrity tools (Duck-ToolBox, OMK, PlayIntegrityFork, TEESimulator-RS, HMA-OSS) + Keybox Autopilot and attach Integrity_Tools.zip. See integrity/INSTALL_ORDER.md for the Strong/Certified/locked-bootloader combo."
        type: boolean
        default: false
      zram_algo:
        description: "ZRAM default compressor: lz4 (fastest, default) or zstd (higher ratio, more effective RAM)"
        type: choice
        options:
          - lz4
          - zstd
        default: lz4
      enable_rekernel:
        description: "Build Re-Kernel as an out-of-tree .ko (binder/signal netlink events). EXPERIMENTAL, OFF by default; needs a userspace consumer to do anything. Never affects the kernel image."
        type: boolean
        default: false

      # --- FolkPatch / KernelPatch (APatch) root (@Dev_DcS) ---
      superkey:
        description: "KernelPatch SuperKey for the CI-prepatched image. Blank = a random 16-hex key, printed in the log and FolkPatch-prepatched.txt. ROOT-EQUIVALENT - keep it private."
        type: string
        default: ""
      ci_prepatch:
        description: "Also build a CI-prepatched kernel: KernelPatch (kpimg) + superkey baked into the Image, with NoMount, your chosen slot-#2 hide KPM (see hide_kpm) and selinux_magisk_access_filter embedded, as a second AnyKernel3 zip (userspace companion zips attached separately; any .kpm in sources/kpms/ is embedded verbatim). EXPERIMENTAL (kpimg/KPM ABI unverified); the stock zip stays the primary output."
        type: boolean
        default: false
      hide_kpm:
        description: "Slot #2 KPM baked into the CI-prepatched image (BreZygisk-safe, NOT NoHello): 'xechide' (byBOOK10086/XEChide - kernel app hiding, LSM path + binder filtering, no userspace injection) or 'hide_env' (klcok/kpm-hide-env - root-environment hiding). 'none' to skip. To pin an exact/closed .kpm, drop it in sources/kpms/ instead."
        type: choice
        options:
          - xechide
          - hide_env
          - none
        default: xechide

jobs:
  # ============================================================================
  # JOB 1: Generate Multi-Version Build Matrix (5.10 -> 6.12 + Root Variants)
  # ============================================================================
  generate-matrix:
    name: "Resolve Kernel & Root Matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Build Dynamic Matrix JSON
        id: set-matrix
        shell: bash
        run: |
          python3 - << 'EOF'
          import json
          import os

          req_family = "${{ inputs.kernel_build_version }}"
          req_lts = "${{ inputs.gki_lts_version }}".strip()
          # box holds only the LTS sublevel (e.g. "144"); tolerate a full
          # "6.6.144" too by keeping just the last dot-component.
          req_sub = req_lts.split(".")[-1].strip() if req_lts else ""
          req_root = "NoRoot"

          all_families = [
              {
                  "kernel_version": "android14-6.1",
                  "kver": "6.1",
                  "manifest_branch": "common-android14-6.1-lts",
                  "susfs_branch": "gki-android14-6.1",
                  "cache_type": "bazel",
                  "build_tool": "bazel",
              },
              {
                  "kernel_version": "android15-6.6",
                  "kver": "6.6",
                  "manifest_branch": "common-android15-6.6-lts",
                  "susfs_branch": "gki-android15-6.6",
                  "cache_type": "bazel",
                  "build_tool": "bazel",
              },
              {
                  "kernel_version": "android16-6.12",
                  "kver": "6.12",
                  "manifest_branch": "common-android16-6.12-lts",
                  "susfs_branch": "gki-android16-6.12",
                  "cache_type": "bazel",
                  "build_tool": "bazel",
              },
          ]

          if req_family == "all":
              selected_families = all_families
          else:
              selected_families = [f for f in all_families if f["kernel_version"] == req_family]

          if req_root == "All":
              roots = ["KernelSU-Next", "KernelSU", "BakaSU"]
          else:
              roots = [req_root]

          include = []
          for fam in selected_families:
              lts_val = "lts"
              if req_sub.isdigit():
                  lts_val = fam["kver"] + "." + req_sub
              for r in roots:
                  entry = dict(fam)
                  entry["lts_version"] = lts_val
                  entry["root_variant"] = r
                  include.append(entry)

          matrix_json = json.dumps({"include": include})
          print("Generated matrix:", matrix_json)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={matrix_json}\n")
          EOF

  # ============================================================================
  # JOB: FolkPatch Standalone Builder (android14-6.1 / android15-6.6 / android16-6.12)
  # ============================================================================
  build-folkpatch:
    name: "Build FolkPatch ${{ matrix.kernel_version }} (${{ matrix.lts_version }})"
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout WildKernels Fork Repository (for finasu_compat / bakasu_compat / susfs scripts)
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Maximize Runner Disk Space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install Build Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git git-lfs gnupg gperf \
            libelf-dev libncurses5-dev libssl-dev libxml2-utils lz4 pahole \
            python3 python3-pip rsync unzip wget xz-utils zip zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          mkdir -p ~/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Restore Build Cache (${{ matrix.cache_type }})
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/ccache
          key: folkpatch-${{ matrix.kernel_version }}-${{ matrix.lts_version }}-${{ matrix.root_variant }}-${{ github.run_id }}
          restore-keys: |
            folkpatch-${{ matrix.kernel_version }}-${{ matrix.lts_version }}-${{ matrix.root_variant }}-
            folkpatch-${{ matrix.kernel_version }}-

      - name: Sync Google GKI Kernel Manifest (${{ matrix.manifest_branch }})
        id: sync-kernel
        shell: bash
        run: |
          mkdir -p kernel_workspace && cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b "${{ matrix.manifest_branch }}" --depth=1
          repo sync -c -j"$(nproc --all)" --no-tags --no-clone-bundle --force-sync

          cd common
          VERSION=$(grep -E '^VERSION = ' Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep -E '^PATCHLEVEL = ' Makefile | awk '{print $3}')
          CURRENT_SUBLEVEL=$(grep -E '^SUBLEVEL = ' Makefile | awk '{print $3}')
          REQ_LTS="${{ matrix.lts_version }}"

          if [ -n "$REQ_LTS" ] && [ "$REQ_LTS" != "lts" ]; then
            TARGET_SUBLEVEL=$(echo "$REQ_LTS" | cut -d. -f3)
            if [ -n "$TARGET_SUBLEVEL" ] && [ "$CURRENT_SUBLEVEL" != "$TARGET_SUBLEVEL" ]; then
              git fetch --unshallow aosp || true
              MATCH_COMMIT=$(git log --grep="Linux ${VERSION}.${PATCHLEVEL}.${TARGET_SUBLEVEL}" -n 1 --format="%H" || true)
              if [ -n "$MATCH_COMMIT" ]; then
                echo "[+] Checking out exact commit for Linux ${VERSION}.${PATCHLEVEL}.${TARGET_SUBLEVEL}: $MATCH_COMMIT"
                git checkout "$MATCH_COMMIT"
              else
                echo "[!] Pinning SUBLEVEL=${TARGET_SUBLEVEL} in Makefile"
                sed -i "s/^SUBLEVEL = .*/SUBLEVEL = ${TARGET_SUBLEVEL}/" Makefile
              fi
              CURRENT_SUBLEVEL="$TARGET_SUBLEVEL"
            fi
          fi

          RESOLVED_KVER="${VERSION}.${PATCHLEVEL}.${CURRENT_SUBLEVEL}"
          echo "resolved_kver=${RESOLVED_KVER}" >> "$GITHUB_OUTPUT"
          echo "resolved_sublevel=${CURRENT_SUBLEVEL}" >> "$GITHUB_OUTPUT"
          echo "[*] Building kernel version: ${RESOLVED_KVER} (${{ matrix.kernel_version }})"

      - name: Fetch WildKernels Patches & SUSFS (${{ matrix.susfs_branch }})
        shell: bash
        run: |
          cd kernel_workspace
          # Prefer vendored WildKernels patches (sources/wild_patches = common/ +
          # gki_ptrace.patch, the subset this build applies). Clone only as fallback.
          V_WILD="$GITHUB_WORKSPACE/sources/wild_patches"
          if [ -d "$V_WILD" ]; then
            echo "[+] Using vendored wild_patches from repo"
            mkdir -p wild_patches && cp -a "$V_WILD/." wild_patches/
          else
            git clone --depth=1 https://github.com/WildKernels/kernel_patches.git wild_patches
          fi
          git clone --depth=1 -b "${{ matrix.susfs_branch }}" https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu || \
            git clone --depth=1 -b "${{ matrix.susfs_branch }}" https://github.com/ShirkNeko/susfs4ksu.git susfs4ksu || true

      - name: Integrate Root Implementation (${{ matrix.root_variant }})
        if: ${{ matrix.root_variant != 'NoRoot' }}
        shell: bash
        run: |
          cd kernel_workspace
          DRIVERS_DIR="common/drivers"
          rm -rf "$DRIVERS_DIR/kernelsu"

          case "${{ matrix.root_variant }}" in
            FinaSU)
              ROOT_REPO="https://github.com/LyraVoid/FinaSU.git"
              ROOT_DIR="FinaSU"
              ROOT_BRANCH=""
              ;;
            BakaSU)
              ROOT_REPO="https://github.com/Baka-SU/BakaSU.git"
              ROOT_DIR="BakaSU"
              ROOT_BRANCH=""
              ;;
            KernelSU-Next)
              if [ "${{ inputs.enable_susfs }}" = "true" ]; then
                ROOT_REPO="https://github.com/pershoot/KernelSU-Next.git"
                ROOT_DIR="KernelSU-Next"
                ROOT_BRANCH="dev-susfs"
              else
                ROOT_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
                ROOT_DIR="KernelSU-Next"
                ROOT_BRANCH="next"
              fi
              ;;
            KernelSU)
              ROOT_REPO="https://github.com/tiann/KernelSU.git"
              ROOT_DIR="KernelSU"
              ROOT_BRANCH="main"
              ;;
            ReSukiSU)
              ROOT_REPO="https://github.com/ReSukiSU/ReSukiSU.git"
              ROOT_DIR="ReSukiSU"
              ROOT_BRANCH="main"
              ;;
            KowSU)
              ROOT_REPO="https://github.com/KOWX712/KernelSU.git"
              ROOT_DIR="KowSU"
              ROOT_BRANCH="master"
              ;;
          esac

          echo "[+] Cloning ${ROOT_DIR} from ${ROOT_REPO}..."
          rm -rf "$ROOT_DIR"
          if [ -n "$ROOT_BRANCH" ]; then
            git clone --depth=1 -b "$ROOT_BRANCH" "$ROOT_REPO" "$ROOT_DIR" || git clone --depth=1 "$ROOT_REPO" "$ROOT_DIR"
          else
            git clone --depth=1 "$ROOT_REPO" "$ROOT_DIR"
          fi

          if [ ! -d "$ROOT_DIR/kernel" ]; then
            echo "[-] Error: $ROOT_DIR/kernel directory not found!"
            exit 1
          fi

          REL_KERNEL="$(realpath --relative-to="$DRIVERS_DIR" "$PWD/$ROOT_DIR/kernel")"
          ln -s "$REL_KERNEL" "$DRIVERS_DIR/kernelsu"
          echo "[+] Linked $DRIVERS_DIR/kernelsu -> $REL_KERNEL"

          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$DRIVERS_DIR/Makefile" || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVERS_DIR/Makefile"

          if [ -f "$DRIVERS_DIR/Kconfig" ] && ! grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVERS_DIR/Kconfig"; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVERS_DIR/Kconfig"
          fi

          # FinaSU manager trust: bake the CURRENT FinaSU manager's signing cert
          # as the auto-trusted slot. Without this, FinaSU's dynamic-manager
          # default trusts only weishu's KernelSU app and the FinaSU manager
          # shows "Not installed". We compute the signature from the actual
          # latest manager APK so it tracks FinaSU updates (v1.4.4+), and fall
          # back to the known v1.4.x cert if the fetch/compute can't run.
          if [ "${{ matrix.root_variant }}" = "FinaSU" ] && [ -f "$ROOT_DIR/kernel/Kbuild" ]; then
            FINA_SZ="0x02cc"
            FINA_HASH="2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458"
            FMGR="$(ls "$GITHUB_WORKSPACE"/managers/*.apk 2>/dev/null | head -1 || true)"
            if [ -z "$FMGR" ]; then
              mkdir -p "$RUNNER_TEMP/fmgr"
              GH_TOKEN="${{ github.token }}" gh release download --repo LyraVoid/FinaSU --pattern '*.apk' --dir "$RUNNER_TEMP/fmgr" 2>/dev/null || true
              FMGR="$(ls "$RUNNER_TEMP"/fmgr/*.apk 2>/dev/null | head -1 || true)"
            fi
            if [ -n "$FMGR" ] && [ -f "$GITHUB_WORKSPACE/scripts/apk_sig.py" ]; then
              SIG="$(python3 "$GITHUB_WORKSPACE/scripts/apk_sig.py" "$FMGR" 2>/dev/null || true)"
              if printf '%s' "$SIG" | grep -qE '^0x[0-9a-f]+ [0-9a-f]{64}$'; then
                FINA_SZ="${SIG%% *}"; FINA_HASH="${SIG##* }"
                echo "[+] FinaSU manager sig computed from $(basename "$FMGR"): $FINA_SZ"
              else
                echo "::warning::FinaSU: live sig compute failed; using known v1.4.x fallback"
              fi
            fi
            sed -i "s/^KSU_EXPECTED_SIZE := .*/KSU_EXPECTED_SIZE := $FINA_SZ/" "$ROOT_DIR/kernel/Kbuild"
            sed -i "s/^KSU_EXPECTED_HASH := .*/KSU_EXPECTED_HASH := $FINA_HASH/" "$ROOT_DIR/kernel/Kbuild"
            grep -q "$FINA_HASH" "$ROOT_DIR/kernel/Kbuild" \
              && echo "[+] FinaSU: trusted manager baked ($FINA_SZ)" \
              || echo "::warning::FinaSU: could not bake manager signature (Kbuild format changed)"
          fi

      - name: Apply SUSFS (${{ matrix.susfs_branch }}) & Regular WildKernels Feature Patches
        shell: bash
        run: |
          cd kernel_workspace
          PATCH_DIR="$GITHUB_WORKSPACE/kernel_workspace/wild_patches"
          SUSFS_DIR="$GITHUB_WORKSPACE/kernel_workspace/susfs4ksu"
          KVER_SHORT="${{ matrix.kver }}"
          SUBLEVEL="${{ steps.sync-kernel.outputs.resolved_sublevel }}"

          # 1. SUSFS + Root Compat + Ptrace/Unicode Fixes
          if [ "${{ inputs.enable_susfs }}" = "true" ] && [ "${{ matrix.root_variant }}" != "KowSU" ] && [ -d "$SUSFS_DIR/kernel_patches" ]; then
            echo "[+] Copying SUSFS fs/ and include/linux/ sources..."
            cp -rf "$SUSFS_DIR/kernel_patches/fs/"* common/fs/ || true
            cp -rf "$SUSFS_DIR/kernel_patches/include/linux/"* common/include/linux/ || true

            # Root-side susfs. Plain tiann KernelSU is the only one without susfs,
            # so it's the only one that gets the 10_enable patch. Next (dev-susfs),
            # BakaSU, ReSukiSU and FinaSU already carry susfs, so handing them
            # 10_enable or the tiann-shaped drift-fix scripts just breaks them -
            # that's what blew up FinaSU's core/init.c. They only need the
            # kernel-side 50_add further down. BakaSU's the odd one: it wants a
            # tiny file of global symbols the susfs patch expects, which the
            # bakasu_compat script drops in if it's around.
            case "${{ matrix.root_variant }}" in
              KernelSU)
                if [ -d "$SUSFS_DIR/kernel_patches/KernelSU" ]; then
                  for kp in "$SUSFS_DIR"/kernel_patches/KernelSU/*.patch; do
                    [ -f "$kp" ] && (cd KernelSU && patch -p1 --forward --fuzz=3 < "$kp") || true
                  done
                fi
                ;;
              BakaSU)
                if [ -f "$GITHUB_WORKSPACE/.github/actions/susfs/bakasu_compat/apply.sh" ]; then
                  bash "$GITHUB_WORKSPACE/.github/actions/susfs/bakasu_compat/apply.sh" BakaSU "${{ matrix.kernel_version }}" "${SUBLEVEL}" || true
                fi
                ;;
              *)
                echo "[+] ${{ matrix.root_variant }}: native SUSFS, kernel-side 50_add only (no 10_enable / no compat)"
                ;;
            esac

            cd common
            for p in "$SUSFS_DIR"/kernel_patches/50_add_susfs_in_gki-*.patch; do
              [ -f "$p" ] && patch -p1 --forward --fuzz=3 < "$p" || true
            done

            # SUSFS core owns the correct fs/notify/fdinfo.c changes for the
            # current tree now that the perf step no longer double-patches it,
            # so no fdinfo.c "restore" is needed - restoring stock would only
            # delete SUSFS's SUS_KSTAT fdinfo spoofing.

            # Ptrace leak fix needs include/linux/tracehook.h, gone after 5.17
            # (on 6.x it half-applies into signal.c); gate it to 5.x.
            case "$KVER_SHORT" in
              5.10|5.15) [ -f "$PATCH_DIR/gki_ptrace.patch" ] && patch -p1 --forward --fuzz=3 < "$PATCH_DIR/gki_ptrace.patch" || true ;;
            esac

            # utf8-norm bypass fix ships two variants split at 6.1; apply the
            # matching one instead of letting both fight over the file.
            case "$KVER_SHORT" in
              5.10|5.15) U="$PATCH_DIR/common/unicode_bypass_fix_6.1-.patch" ;;
              *)         U="$PATCH_DIR/common/unicode_bypass_fix_6.1+.patch" ;;
            esac
            [ -f "$U" ] && patch -p1 --forward --fuzz=3 < "$U" || true
          else
            cd common
          fi

          find . \( -name "*.rej" -o -name "*.orig" \) -delete || true

          # 2. Baseband Guard (BBG)
          if [ "${{ 'true' }}" = "true" ]; then
            echo "[+] Integrating Baseband Guard (BBG)..."
            # Prefer the vendored Baseband-guard (sources/baseband-guard, pinned).
            # A throwaway 'git init' (no remote) makes BBG's own setup.sh take its
            # no-clone / no-fetch path, so it wires the tree from the vendored files
            # without pulling upstream. Fall back to the upstream setup.sh otherwise.
            BV="$GITHUB_WORKSPACE/sources/baseband-guard"
            if [ -d "$BV" ]; then
              echo "[+] Using vendored Baseband-guard from repo (pinned)"
              rm -rf Baseband-guard && cp -a "$BV" Baseband-guard
              git -C Baseband-guard init -q 2>/dev/null || true
              bash Baseband-guard/setup.sh || true
            else
              curl -LSs https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash || true
            fi
            find "$PATCH_DIR" -name "*bbg*.patch" -exec sh -c 'patch -p1 --forward --fuzz=3 < "$1" || true' _ {} \;
            # BBG's own Makefile bails ("BBG not enable in CONFIG_LSM") unless
            # 'baseband_guard' is in CONFIG_LSM. setup.sh drops the source in but
            # never touches the LSM list, so we add it ourselves - into the
            # default in security/Kconfig (same thing WildKernels' bbg action
            # does) and into any explicit CONFIG_LSM= in the defconfig.
            if [ -d security/baseband-guard ]; then
              sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
              DEF="arch/arm64/configs/gki_defconfig"
              if grep -q '^CONFIG_LSM=' "$DEF" && ! grep -q '^CONFIG_LSM=.*baseband_guard' "$DEF"; then
                sed -i 's/^\(CONFIG_LSM="[^"]*\)selinux/\1selinux,baseband_guard/' "$DEF"
              fi
              grep -q baseband_guard security/Kconfig \
                && echo "[+] baseband_guard added to CONFIG_LSM default" \
                || echo "::warning::BBG: could not add baseband_guard to CONFIG_LSM"
            fi
          fi

          # 2b. NV write guard (opt-in, default OFF). Protects the modem's
          # irreplaceable nv_protected.bin (RF calibration / IMEI) from a torn
          # or stray write - the classic way a Shannon efs ends up bricked.
          # nv_normal.bin is left writable on purpose so the modem can still
          # heal itself. Ships as a tiny LSM; only bites once it is in CONFIG_LSM.
          if [ "${{ 'true' }}" = "true" ]; then
            echo "[+] Integrating NV write guard (nv_guard LSM)..."
            NVD="$GITHUB_WORKSPACE/kernel-patches/nv_guard"
            # Copy the sources in rather than applying a context patch: the
            # patch was cut against 6.6, and security/Kconfig + security/Makefile
            # differ across 5.10..6.18, so `patch --fuzz` lands at the wrong
            # offset on other trees (it corrupted security/Kconfig on 5.10).
            # The .c/.Kconfig/.Makefile themselves are version-independent.
            if [ ! -f security/nv_guard/nv_guard.c ] && [ -f "$NVD/nv_guard.c" ]; then
              mkdir -p security/nv_guard
              cp "$NVD/nv_guard.c" "$NVD/Kconfig" "$NVD/Makefile" security/nv_guard/
              echo "[+] nv_guard sources copied into security/nv_guard/"
            fi
            if [ -f security/nv_guard/nv_guard.c ]; then
              # Wire Kconfig/Makefile by anchor, idempotently - no diff to fuzz.
              # keys/Kconfig is the first `source` inside the security menu on
              # every GKI version, so inserting after it is always in-menu.
              grep -q 'security/nv_guard/Kconfig' security/Kconfig || \
                sed -i 's#^source "security/keys/Kconfig"#&\nsource "security/nv_guard/Kconfig"#' security/Kconfig
              grep -q 'nv_guard/' security/Makefile || \
                printf 'obj-$(CONFIG_NV_WRITE_GUARD) += nv_guard/\n' >> security/Makefile
              DEF="arch/arm64/configs/gki_defconfig"
              grep -q '^CONFIG_NV_WRITE_GUARD=y' "$DEF" || echo 'CONFIG_NV_WRITE_GUARD=y' >> "$DEF"
              sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /nv_guard/! s/selinux/selinux,nv_guard/ } }' security/Kconfig
              if grep -q '^CONFIG_LSM=' "$DEF" && ! grep -q '^CONFIG_LSM=.*nv_guard' "$DEF"; then
                sed -i 's/^\(CONFIG_LSM="[^"]*\)selinux/\1selinux,nv_guard/' "$DEF"
              fi
              echo "[+] nv_guard wired (sources + Kconfig/Makefile + CONFIG_LSM)"
            else
              echo "::warning::nv_write_guard requested but kernel-patches/nv_guard sources not found; skipping"
            fi
          fi

          # 2c. Security patch level.
          #   monthly    - whatever the base sync pulled (latest tagged GKI/LTS).
          #                That already IS the Android monthly CVE set, merged
          #                and tested together upstream. Nothing extra to do.
          #   latest-cve - also fast-forward this series' post-release stable
          #                CVE fixes on top (git am --3way). Anything that does
          #                not apply cleanly is ABORTED and logged, never fuzzed
          #                in. Bleeding edge; may apply nothing if the base tag
          #                is not reachable in the synced tree. See README.
          #   none       - build the base exactly as pinned.
          case "${{ inputs.security_patches }}" in
            latest-cve)
              echo "[+] security_patches=latest-cve: topping up with post-release stable CVE fixes..."
              git config user.email "ci@local" 2>/dev/null || true
              git config user.name "ci" 2>/dev/null || true
              KVER="$(make -s kernelversion 2>/dev/null || true)"
              SERIES="$(echo "$KVER" | cut -d. -f1-2)"
              OUTD="$GITHUB_WORKSPACE/cve-out"; mkdir -p "$OUTD"
              OKF="$OUTD/cve-applied.txt"; SKF="$OUTD/cve-skipped.txt"; : > "$OKF"; : > "$SKF"
              STABLE="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git"
              # The synced Android tree never carries upstream stable tags, so the
              # base tag has to come from linux-stable too, or it's never found.
              if git fetch --no-tags --depth=400 "$STABLE" "linux-${SERIES}.y:refs/cve_tip" "refs/tags/v${KVER}:refs/tags/v${KVER}" 2>/dev/null; then
                # The base must sit inside the fetched history, otherwise rev-list
                # walks past it into commits the tree already has. Deepen until it does.
                for d in 800 1600 3200; do
                  git merge-base --is-ancestor "v${KVER}" refs/cve_tip 2>/dev/null && break
                  git fetch --no-tags --deepen="$d" "$STABLE" "linux-${SERIES}.y:refs/cve_tip" 2>/dev/null || break
                done
                if git merge-base --is-ancestor "v${KVER}" refs/cve_tip 2>/dev/null; then
                  mapfile -t SHAS < <(git rev-list --reverse "v${KVER}..refs/cve_tip" 2>/dev/null)
                  echo "[i] ${SERIES}: ${#SHAS[@]} post-${KVER} stable commits to try"
                  for sha in "${SHAS[@]}"; do
                    subj="$(git log -1 --format='%s' "$sha" 2>/dev/null || true)"
                    if git format-patch -1 --stdout "$sha" 2>/dev/null | git am --3way >/dev/null 2>&1; then
                      echo "$sha  $subj" >> "$OKF"
                    else
                      git am --abort >/dev/null 2>&1 || true
                      echo "$sha  $subj" >> "$SKF"
                    fi
                  done
                  echo "[+] latest-cve: applied $(wc -l < "$OKF" | tr -d ' '), skipped $(wc -l < "$SKF" | tr -d ' ') (lists in cve-out/)"
                else
                  echo "::warning::latest-cve: base tag v${KVER} not reachable in the synced tree; skipping CVE top-up (monthly base is unchanged)"
                fi
              else
                echo "::warning::latest-cve: could not fetch the stable tree for ${SERIES}; skipping CVE top-up"
              fi
              ;;
            none)
              echo "[i] security_patches=none: building the base exactly as pinned"
              ;;
            *)
              echo "[i] security_patches=monthly: latest tagged GKI/LTS base carries the Android monthly CVE set"
              ;;
          esac

          # 3. NTSync. drivers/misc/ntsync.c ships only on 6.12; every other
          # family needs ntsync_base.patch to ADD it, plus a per-family compat
          # patch that wires Kconfig/Makefile. The old `find -path "*6.6*"` only
          # matched the compat patch (ntsync_base has no version in its name),
          # so CONFIG_NTSYNC=y referenced a drivers/misc/ntsync.o whose source
          # was never created -> "No rule to make target drivers/misc/ntsync.o".
          if [ "${{ (inputs.net_features == 'both' || inputs.net_features == 'ntsync') && 'true' || 'false' }}" = "true" ]; then
            echo "[+] Applying NTSync for ${{ matrix.kernel_version }}..."
            NT="$PATCH_DIR/common/ntsync"
            # 6.12 already carries ntsync.c/.h; drop them so base re-adds a known copy
            if [ "${{ matrix.kernel_version }}" = "android16-6.12" ]; then
              rm -f include/uapi/linux/ntsync.h drivers/misc/ntsync.c
            fi
            case "${{ matrix.kernel_version }}" in
              android13-5.10) COMPAT="$NT/ntsync_compat_android12-5.10.patch" ;;
              android14-5.15) COMPAT="$NT/ntsync_compat_android13-5.15.patch" ;;
              *)              COMPAT="$NT/ntsync_compat_${{ matrix.kernel_version }}.patch" ;;
            esac
            if [ -f "$COMPAT" ]; then patch -p1 --forward --fuzz=3 < "$COMPAT" || true; else echo "::warning::NTSync: compat patch not found ($COMPAT)"; fi
            if [ -f "$NT/ntsync_base.patch" ]; then patch -p1 --forward --fuzz=3 < "$NT/ntsync_base.patch" || true; else echo "::warning::NTSync: ntsync_base.patch not found"; fi
          fi

          # 4. Networking (BBRv3 / Netfilter for matching kernel series)
          if [ "${{ (inputs.net_features == 'both' || inputs.net_features == 'networking') && 'true' || 'false' }}" = "true" ]; then
            echo "[+] Applying Networking patches for ${KVER_SHORT}..."
            find "$PATCH_DIR/common" -path "*${KVER_SHORT}*" -name "*bbr*.patch" -exec sh -c 'patch -p1 --forward --fuzz=3 < "$1" || true' _ {} \;
          fi

          # 5. DroidSpaces-OSS
          if [ "${{ inputs.enable_droidspaces }}" = "true" ]; then
            echo "[+] Applying DroidSpaces-OSS patches..."
            find "$PATCH_DIR" -name "*droidspaces*.patch" -exec sh -c 'patch -p1 --forward --fuzz=3 < "$1" || true' _ {} \;
          fi

          # 6. Performance tuning patches.
          # Do NOT point this at wild_patches/wild: that tree is archived SUSFS
          # fix-ups for old 5.x/preview layouts (base.c, fdinfo.c, task_mmu.c),
          # manual hook patches and KSU-Next bundles. Run with --fuzz over a
          # current 6.x tree they stack stale code on top of SUSFS - that is what
          # broke fs/proc/base.c here (BIT_SUS_MAPS / vma) and fs/notify/fdinfo.c
          # before. Only the real perf patches from common/, each one that does
          # not apply cleanly is skipped (dry-run first) instead of fuzzing in.
          if [ "${{ inputs.enable_performance }}" = "true" ]; then
            echo "[+] Applying WildKernels performance patches..."
            for name in \
              add_timeout_wakelocks_globally adjust_cpu_scan_order \
              avoid_extra_s2idle_wake_attempts clear_page_16bytes_align \
              disable_cache_hot_buddy f2fs_enlarge_min_fsync_blocks \
              f2fs_reduce_congestion file_struct_8bytes_align \
              increase_ext4_default_commit_age increase_sk_mem_packets \
              int_sqrt mem_opt_prefetch minimise_wakeup_time optimise_memcmp \
              optimized_mem_operations reduce_cache_pressure reduce_freeze_timeout \
              reduce_gc_thread_sleep_time reduce_pci_pme_wakeups \
              use_unlikely_wrap_cpufreq; do
              p="$PATCH_DIR/common/${name}.patch"
              [ -f "$p" ] || continue
              if patch -p1 -N -s --dry-run -i "$p" >/dev/null 2>&1; then
                patch -p1 -N -s --no-backup-if-mismatch -i "$p"
                echo "  [ok]   $name"
              else
                echo "  [skip] $name (doesn't apply on ${{ matrix.kernel_version }})"
              fi
            done
          fi

          # 7. Module Check Bypass (5.10 uses kernel/module.c; 5.15+/6.x uses kernel/module/version.c)
          if [ "${{ inputs.allow_version_mismatch }}" = "true" ]; then
            echo "[+] Applying Module Check Bypass..."
            if [ -f kernel/module/version.c ]; then
              sed -i 's/return 0;/return 1;/g' kernel/module/version.c || true
            elif [ -f kernel/module.c ]; then
              sed -i '/check_version/,/^}/ s/return 0;/return 1;/g' kernel/module.c || true
            fi
          fi

          find . \( -name "*.rej" -o -name "*.orig" \) -delete || true

      - name: Configure Kernel (`gki_defconfig` & Kleaf Protected Exports for ${{ matrix.kernel_version }})
        shell: bash
        env:
          CUSTOM_KERNEL_NAME: ${{ inputs.kernel_name }}
        run: |
          cd kernel_workspace/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          set_kconfig() {
            local key="$1"
            local val="$2"
            sed -i "/^${key}=/d" "$DEFCONFIG"
            sed -i "/^# ${key} is not set/d" "$DEFCONFIG"
            if [ "$val" = "n" ]; then
              echo "# ${key} is not set" >> "$DEFCONFIG"
            else
              echo "${key}=${val}" >> "$DEFCONFIG"
            fi
          }

          # Custom kernel name (replaces the -maybe-dirty scm marker in uname).
          # Read from an env var so a malicious input can't inject shell.
          # CONFIG_LOCALVERSION adds the name; AUTO=n drops the git/dirty suffix.
          if [ -n "${CUSTOM_KERNEL_NAME:-}" ]; then
            KN="$(printf '%s' "$CUSTOM_KERNEL_NAME" | tr -cd 'A-Za-z0-9._-')"
            if [ -n "$KN" ]; then
              set_kconfig CONFIG_LOCALVERSION "\"-$KN\""
              set_kconfig CONFIG_LOCALVERSION_AUTO n
              echo "[+] Kernel name: -$KN"
            fi
          fi

          # Disable CONFIG_WERROR so unused-variable warnings in patched files never fail the build
          set_kconfig CONFIG_WERROR n
          # ZRAM default compressor (@Dev_DcS). lz4 is the fastest and the
          # default; zstd trades a little CPU for a notably higher ratio (more
          # effective RAM). Both are in the GKI crypto set - we just enable the
          # backend and point ZRAM's default at it. Runtime can still override.
          case "${{ inputs.zram_algo }}" in
            zstd)
              set_kconfig CONFIG_CRYPTO_ZSTD y
              set_kconfig CONFIG_ZRAM_DEF_COMP_ZSTD y
              set_kconfig CONFIG_ZRAM_DEF_COMP "\"zstd\""
              echo "[+] ZRAM default compressor: zstd"
              ;;
            *)
              set_kconfig CONFIG_CRYPTO_LZ4 y
              set_kconfig CONFIG_ZRAM_DEF_COMP_LZ4 y
              echo "[+] ZRAM default compressor: lz4 (default)"
              ;;
          esac
          echo "KBUILD_CFLAGS += -Wno-error -Wno-unused-variable -Wno-unused-function -Wno-unused-label -Wno-unused-but-set-variable" >> Makefile

          if [ "${{ matrix.root_variant }}" != "NoRoot" ]; then
            set_kconfig CONFIG_KSU y
            set_kconfig CONFIG_KALLSYMS_ALL y
            set_kconfig CONFIG_KPROBES y
          fi
          if [ "${{ inputs.enable_susfs }}" = "true" ] && [ "${{ matrix.root_variant }}" != "KowSU" ] && [ -f fs/susfs.c ]; then
            set_kconfig CONFIG_KSU_SUSFS y
            set_kconfig CONFIG_KSU_SUSFS_SUS_PATH y
            set_kconfig CONFIG_KSU_SUSFS_SUS_MOUNT y
            set_kconfig CONFIG_KSU_SUSFS_SUS_KSTAT y
            set_kconfig CONFIG_KSU_SUSFS_SPOOF_UNAME y
            set_kconfig CONFIG_KSU_SUSFS_ENABLE_LOG y
            set_kconfig CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
            set_kconfig CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
            set_kconfig CONFIG_KSU_SUSFS_OPEN_REDIRECT y
            set_kconfig CONFIG_KSU_SUSFS_SUS_MAP y
          fi

          if [ "${{ inputs.enable_nomount }}" = "true" ]; then
            set_kconfig CONFIG_TMPFS_XATTR y
            set_kconfig CONFIG_TMPFS_POSIX_ACL y
          fi

          if [ "${{ (inputs.net_features == 'both' || inputs.net_features == 'networking') && 'true' || 'false' }}" = "true" ]; then
            set_kconfig CONFIG_WIREGUARD y
            set_kconfig CONFIG_TCP_CONG_ADVANCED y
            set_kconfig CONFIG_TCP_CONG_BBR y
            # =y (GKI default =m emits undeclared tcp_*.ko -> module check fails)
            set_kconfig CONFIG_TCP_CONG_BIC y
            set_kconfig CONFIG_TCP_CONG_HTCP y
            set_kconfig CONFIG_TCP_CONG_WESTWOOD y
            set_kconfig CONFIG_NET_SCH_FQ y
            set_kconfig CONFIG_NET_SCH_CAKE y
            set_kconfig CONFIG_IP_SET y
            set_kconfig CONFIG_IP_SET_MAX 256
            set_kconfig CONFIG_NETFILTER_XT_TARGET_HL y
            set_kconfig CONFIG_NETFILTER_XT_TARGET_CONNMARK y
            set_kconfig CONFIG_CIFS y
          fi

          if [ "${{ inputs.enable_bpf }}" = "true" ]; then
            set_kconfig CONFIG_BPF_SYSCALL y
            set_kconfig CONFIG_BPF_JIT y
            set_kconfig CONFIG_DEBUG_INFO_BTF y
          fi

          # only enable NTSync if its source actually made it into the tree,
          # else built-in.a references a drivers/misc/ntsync.o with no source
          if [ "${{ (inputs.net_features == 'both' || inputs.net_features == 'ntsync') && 'true' || 'false' }}" = "true" ] && [ -f drivers/misc/ntsync.c ]; then
            set_kconfig CONFIG_NTSYNC y
          fi


          # Remove check_defconfig and relax KMI symbol trimming in legacy build configs
          sed -i 's/check_defconfig//' build.config.gki* || true
          sed -i 's/TRIM_NONLISTED_KMI=1/TRIM_NONLISTED_KMI=0/g' build.config.gki* || true
          sed -i 's/KMI_SYMBOL_LIST_STRICT_MODE=1/KMI_SYMBOL_LIST_STRICT_MODE=0/g' build.config.gki* || true
          # Names vary across GKI versions - strip the check from any build.config that still has it.
          grep -rlZ 'check_defconfig' . --include='build.config*' 2>/dev/null | xargs -0r sed -i 's/check_defconfig//g' || true

          # Relax Kleaf's defconfig check (minimized -> disabled) so appended
          # symbols stand and the full module set + CONFIG_RUST are preserved.
          # Strip Kleaf's '-maybe-dirty' scmversion placeholder from uname.
          STAMP_BZL="../build/kernel/kleaf/impl/stamp.bzl"
          if [ -f "$STAMP_BZL" ] && grep -q "maybe-dirty" "$STAMP_BZL"; then
            sed -i "s/-maybe-dirty//g" "$STAMP_BZL" && echo "[+] removed -maybe-dirty scmversion placeholder" || echo "::warning::could not strip -maybe-dirty from stamp.bzl"
          fi
          CK_BZL="../build/kernel/kleaf/common_kernels.bzl"
          if [ -f "$CK_BZL" ] && grep -q '"minimized"' "$CK_BZL"; then
            sed -i 's/else "minimized"/else "disabled"/g; s/: "minimized"/: "disabled"/g' "$CK_BZL"
            if grep -q '"minimized"' "$CK_BZL"; then
              echo "::warning::check_defconfig still 'minimized' in common_kernels.bzl; the defconfig check may still run"
            else
              echo "[+] check_defconfig minimized -> disabled (Kleaf defconfig check relaxed; defconfig/modules untouched)"
            fi
          else
            echo "[i] no check_defconfig=\"minimized\" in common_kernels.bzl (older Kleaf) - nothing to relax"
          fi

          # Empty protected exports files in-place and disable strict KMI trimming (without deleting lines)
          for f in android/abi_gki_protected_exports_*; do
            [ -f "$f" ] && : > "$f"
          done
          for bzl in BUILD.bazel ../build/kernel/kleaf/common_kernels.bzl; do
            if [ -f "$bzl" ]; then
              sed -i 's/trim_nonlisted_kmi = True/trim_nonlisted_kmi = False/g' "$bzl" || true
              sed -i 's/kmi_symbol_list_strict_mode = True/kmi_symbol_list_strict_mode = False/g' "$bzl" || true
            fi
          done


      - name: Compile Kernel (${{ matrix.kernel_version }} - Auto Bazel / build.sh Dispatch)
        shell: bash
        run: |
          cd kernel_workspace
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace/out/dist"

          if [ "${{ matrix.build_tool }}" = "bazel" ] || { [ "${{ matrix.build_tool }}" = "auto" ] && [ -x tools/bazel ]; }; then
            echo "[+] Building ${{ matrix.kernel_version }} with Kleaf / Bazel (page_size=${{ inputs.page_size }})..."
            if [ "${{ inputs.page_size }}" = "16k" ] && grep -q "kernel_aarch64_16k_dist" common/BUILD.bazel 2>/dev/null; then
              BAZEL_TARGET="//common:kernel_aarch64_16k_dist"
            else
              BAZEL_TARGET="//common:kernel_aarch64_dist"
            fi
            tools/bazel run --config=fast --verbose_failures "${BAZEL_TARGET}" -- --dist_dir="$GITHUB_WORKSPACE/kernel_workspace/out/dist"
          else
            echo "[+] Building ${{ matrix.kernel_version }} with legacy build/build.sh + ccache..."
            export CCACHE_DIR="$HOME/.cache/ccache"
            export USE_CCACHE=1
            ccache -M 12G || true
            LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 DIST_DIR="$GITHUB_WORKSPACE/kernel_workspace/out/dist" build/build.sh
          fi

      - name: Package Flashable AnyKernel3 Archive & BuildInfo
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git AnyKernel3 || \
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          if [ -f kernel_workspace/out/dist/Image ]; then
            cp -f kernel_workspace/out/dist/Image AnyKernel3/Image
          elif [ -f kernel_workspace/bazel-bin/common/kernel_aarch64/Image ]; then
            cp -f kernel_workspace/bazel-bin/common/kernel_aarch64/Image AnyKernel3/Image
          else
            FOUND_IMG=$(find kernel_workspace -type f -name "Image" | head -n 1 || true)
            if [ -n "$FOUND_IMG" ]; then
              cp -f "$FOUND_IMG" AnyKernel3/Image
            fi
          fi

          if [ ! -f AnyKernel3/Image ]; then
            echo "[-] Error: Compiled kernel Image not found!"
            exit 1
          fi

          KVER_FULL="${{ steps.sync-kernel.outputs.resolved_kver }}"
          ZIP_NAME="${KVER_FULL}-${{ matrix.kernel_version }}-FolkPatch-AnyKernel3.zip"
          (cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" .)

          cat << EOF > BuildInfo.txt
          Kernel Family: ${{ matrix.kernel_version }}
          Resolved Kernel Version: ${KVER_FULL}
          Page Size: ${{ inputs.page_size }}
          Manifest Branch: ${{ matrix.manifest_branch }}
          SUSFS Branch: ${{ matrix.susfs_branch }} (Enabled: ${{ inputs.enable_susfs }})
          Root Implementation: FolkPatch (KernelPatch/APatch - kernel built stock; patch on-device with the FolkPatch app or use the CI-prepatched zip)
          NoMount / TMPFS ACL: ${{ inputs.enable_nomount }}
          Baseband Guard (BBG) + NV write-guard: enabled (bbg+nv)
          Networking Suite: ${{ (inputs.net_features == 'both' || inputs.net_features == 'networking') && 'true' || 'false' }}
          Extended BPF/BTF: ${{ inputs.enable_bpf }}
          NTSync (/dev/ntsync): ${{ (inputs.net_features == 'both' || inputs.net_features == 'ntsync') && 'true' || 'false' }}
          DroidSpaces-OSS: ${{ inputs.enable_droidspaces }}
          Module Check Bypass: ${{ inputs.allow_version_mismatch }}
          EOF

      - name: Upload AnyKernel3 ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}-FolkPatch-AnyKernel3"
          path: "*-AnyKernel3.zip"

      - name: Upload BuildInfo
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}-FolkPatch-BuildInfo"
          path: BuildInfo.txt

      - name: Fetch matching root manager APK (${{ matrix.root_variant }})
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p managers
          # FolkPatch (KernelPatch/APatch) is NOT compiled into the kernel: the
          # app patches the boot image on-device (or the CI-prepatch step below
          # bakes it). Grab the FolkPatch manager APK so it ships in one place.
          case "${{ matrix.root_variant }}" in
            FinaSU)        MGR_REPO="LyraVoid/FinaSU" ;;
            BakaSU)        MGR_REPO="Baka-SU/BakaSU" ;;
            KernelSU-Next) MGR_REPO="KernelSU-Next/KernelSU-Next" ;;
            KernelSU)      MGR_REPO="tiann/KernelSU" ;;
            ReSukiSU)      MGR_REPO="ReSukiSU/ReSukiSU" ;;
            KowSU)         MGR_REPO="KOWX712/KernelSU" ;;
            NoRoot)        MGR_REPO="LyraVoid/FolkPatch" ;;
            *)             MGR_REPO="" ;;
          esac
          if [ -z "$MGR_REPO" ]; then
            echo "[i] ${{ matrix.root_variant }}: no manager app to fetch"
            exit 0
          fi
          echo "[+] Fetching manager APK from $MGR_REPO (latest release)..."
          if gh release download --repo "$MGR_REPO" --pattern '*.apk' --dir managers 2>/dev/null; then
            echo "[+] manager APK(s): $(ls managers 2>/dev/null | tr '\n' ' ')"
          else
            echo "::warning::no .apk in $MGR_REPO latest release (or repo unavailable); install the $MGR_REPO manager by hand"
          fi

      - name: Upload Root Manager APK
        if: hashFiles('managers/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}-${{ matrix.root_variant }}-Manager"
          path: managers/*.apk

      - name: Fetch NoMount module
        if: ${{ true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p nomount_out
          echo "[+] Fetching NoMount module (maxsteeel/nomount, latest release)..."
          if gh release download --repo maxsteeel/nomount --pattern '*.zip' --dir nomount_out 2>/dev/null; then
            echo "[+] NoMount module(s): $(ls nomount_out 2>/dev/null | tr '\n' ' ')"
          else
            echo "::warning::could not fetch the NoMount module (no zip asset or repo unavailable); install it by hand"
          fi

      - name: Upload NoMount module
        if: ${{ hashFiles('nomount_out/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}-${{ matrix.root_variant }}-NoMount"
          path: nomount_out/*

      - name: Build Re-Kernel module (out-of-tree, experimental, @Dev_DcS)
        if: ${{ inputs.enable_rekernel == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          cd kernel_workspace
          REK_SRC="$GITHUB_WORKSPACE/sources/rekernel/LKM-Source"
          LOADER="$GITHUB_WORKSPACE/sources/rekernel/loader"
          if [ ! -f "$REK_SRC/Makefile" ]; then echo "::warning::Re-Kernel: vendored source missing, skipping (kernel zip unaffected)"; exit 0; fi
          OBJ="$RUNNER_TEMP/rek_kobj"; rm -rf "$OBJ"; mkdir -p "$OBJ"
          REK="$GITHUB_WORKSPACE/rekernel_build"; rm -rf "$REK"; mkdir -p "$REK"; cp -a "$REK_SRC/." "$REK/"
          cfg=""; for c in bazel-bin/common/kernel_aarch64_config/out_dir/.config out/dist/.config out/.config; do [ -f "$c" ] && cfg="$c" && break; done
          [ -n "$cfg" ] || cfg="$(find . -maxdepth 5 -type f -name .config 2>/dev/null | head -n1 || true)"
          img=""; for i in out/dist/Image bazel-bin/common/kernel_aarch64/Image; do [ -f "$i" ] && img="$i" && break; done
          [ -n "$img" ] || img="$(find . -maxdepth 5 -type f -name Image 2>/dev/null | head -n1 || true)"
          if [ -z "$cfg" ] || [ -z "$img" ]; then echo "::warning::Re-Kernel: no .config/Image, skipping (kernel zip unaffected)"; exit 0; fi
          krel="$(strings -n 16 "$img" | sed -n 's/^Linux version \([0-9][^ ]*\) .*/\1/p' | head -n1)"; [ -n "$krel" ] || krel="${{ steps.sync-kernel.outputs.resolved_kver }}"
          clang_ver="$(sed -n 's/^CLANG_VERSION=//p' common/build.config.constants 2>/dev/null | head -n1 || true)"
          clang_bin="$(sed -n 's/^CLANG_PREBUILT_BIN=//p' common/build.config.common 2>/dev/null | head -n1 || true)"
          clang_bin="${clang_bin//\$\{CLANG_VERSION\}/$clang_ver}"
          [ -x "$clang_bin/clang" ] || clang_bin="prebuilts/clang/host/linux-x86/clang-${clang_ver}/bin"
          [ -x "$clang_bin/clang" ] || clang_bin="$(find prebuilts*/clang/host/linux-x86 -maxdepth 2 -path '*/clang-r*/bin' -type d 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$clang_bin" ] || [ ! -x "$clang_bin/clang" ]; then echo "::warning::Re-Kernel: no prebuilt clang, skipping"; exit 0; fi
          export PATH="$PWD/$clang_bin:$PATH"
          cp "$cfg" "$OBJ/.config"
          [ -f common/scripts/config ] && common/scripts/config --file "$OBJ/.config" --disable RUST || true
          mk=(make -C common O="$OBJ" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ -j"$(nproc)")
          "${mk[@]}" olddefconfig || { echo "::warning::Re-Kernel: olddefconfig failed, skipping"; exit 0; }
          "${mk[@]}" modules_prepare || { echo "::warning::Re-Kernel: modules_prepare failed, skipping"; exit 0; }
          echo "$krel" > "$OBJ/include/config/kernel.release"
          printf '#define UTS_RELEASE "%s"\n' "$krel" > "$OBJ/include/generated/utsrelease.h"
          sv="$(find bazel-bin/common/kernel_aarch64 out -maxdepth 3 \( -name vmlinux.symvers -o -name Module.symvers \) -type f 2>/dev/null | head -n1 || true)"
          [ -n "$sv" ] && cp "$sv" "$OBJ/Module.symvers" || echo "::warning::Re-Kernel: no symvers, core symbols unversioned"
          if ! "${mk[@]}" M="$REK" KBUILD_MODPOST_WARN=1 modules; then echo "::warning::Re-Kernel: module build failed (vendor-hook mismatch on this KMI?); skipping, kernel zip unaffected"; exit 0; fi
          ko="$(find "$REK" -name 'rekernel*.ko' -type f | head -n1 || true)"
          [ -n "$ko" ] || { echo "::warning::Re-Kernel: no .ko produced, skipping"; exit 0; }
          llvm-strip --strip-debug "$ko" 2>/dev/null || true
          echo "[+] built $(basename "$ko")  vermagic: $(modinfo -F vermagic "$ko" 2>/dev/null || echo '?')"
          PKG="$GITHUB_WORKSPACE/rekernel_pkg"; rm -rf "$PKG"; mkdir -p "$PKG"
          cp -a "$LOADER/." "$PKG/"
          cp "$ko" "$PKG/rekernel-${krel}.ko"
          sed -i "s|@KREL@|${krel}|g; s|@VC@|$(date +%Y%m%d)|g" "$PKG/module.prop.in"
          mv "$PKG/module.prop.in" "$PKG/module.prop"
          ZIP="$GITHUB_WORKSPACE/Re-Kernel-${krel}-DevDcS.zip"
          (cd "$PKG" && zip -rqX "$ZIP" .)
          echo "[+] packaged $(basename "$ZIP")"

      - name: Upload Re-Kernel module
        if: ${{ inputs.enable_rekernel == 'true' && hashFiles('Re-Kernel-*-DevDcS.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}-Re-Kernel"
          path: Re-Kernel-*-DevDcS.zip

      - name: Fetch & bundle Integrity Tools (Integrity_Tools.zip)
        if: ${{ inputs.integrity_bundle == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          chmod +x scripts/fetch_integrity_tools.sh 2>/dev/null || true
          if ! bash scripts/fetch_integrity_tools.sh "$GITHUB_WORKSPACE/Integrity_Tools" "$GITHUB_WORKSPACE"; then
            echo "::warning::Integrity tools fetch failed (kernel zip unaffected)"; exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          rm -f Integrity_Tools.zip
          zip -rqX Integrity_Tools.zip Integrity_Tools || true

      - name: Upload Integrity_Tools.zip
        if: ${{ inputs.integrity_bundle == 'true' && hashFiles('Integrity_Tools.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Integrity_Tools
          path: Integrity_Tools.zip

      - name: Setup Zig (only when building the XEChide KPM)
        if: ${{ inputs.ci_prepatch == 'true' && inputs.hide_kpm == 'xechide' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: FolkPatch - CI-prepatch kernel + embed KPMs (NoMount / slot-#2 / selinux_maf) (@Dev_DcS)
        if: ${{ inputs.ci_prepatch == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          cd kernel_workspace
          IMG="AnyKernel3/Image"
          if [ ! -f "$IMG" ]; then echo "::warning::FolkPatch: no AnyKernel3/Image, skipping prepatch (stock zip unaffected)"; exit 0; fi

          # SuperKey: user-supplied or a random 16-hex key. Root-equivalent, so it
          # is written to FolkPatch-prepatched.txt (uploaded) rather than hidden.
          SKEY="${{ inputs.superkey }}"
          if [ -z "$SKEY" ]; then SKEY="$(head -c8 /dev/urandom | od -An -tx1 | tr -d ' \n' | cut -c1-16)"; fi
          echo "[+] FolkPatch superkey: $SKEY"

          # Build kptools (host) + kpimg (arm64) straight from FolkPatch's own
          # KernelPatch base, so the baked image matches the FolkPatch manager.
          KP="$RUNNER_TEMP/kernelpatch"; rm -rf "$KP"
          if ! git clone --depth=1 https://github.com/LyraVoid/KernelPatch "$KP"; then
            echo "::warning::FolkPatch: KernelPatch clone failed, skipping prepatch"; exit 0
          fi
          # kptools: a plain host-linux binary (make, else cmake).
          if ! make -C "$KP/tools" >/dev/null 2>&1; then
            ( cd "$KP/tools" && rm -rf build && mkdir -p build && cd build \
                && cmake .. >/dev/null 2>&1 && cmake --build . >/dev/null 2>&1 ) || true
          fi
          KPTOOLS="$(find "$KP/tools" -maxdepth 3 -type f -name kptools -perm -u+x 2>/dev/null | head -n1 || true)"
          if [ -z "$KPTOOLS" ]; then echo "::warning::FolkPatch: kptools build failed, skipping prepatch"; exit 0; fi

          # kpimg: freestanding arm64 payload. Needs a GNU aarch64 toolchain; the
          # runner usually has it or can add it (best-effort).
          command -v aarch64-linux-gnu-gcc >/dev/null 2>&1 || sudo apt-get install -y gcc-aarch64-linux-gnu >/dev/null 2>&1 || true
          if ! make -C "$KP/kernel" TARGET_COMPILE=aarch64-linux-gnu- >/dev/null 2>&1; then
            make -C "$KP/kernel" >/dev/null 2>&1 || true
          fi
          KPIMG="$(find "$KP/kernel" -maxdepth 2 -type f -name 'kpimg*' ! -name '*.lds' 2>/dev/null | head -n1 || true)"
          if [ -z "$KPIMG" ]; then echo "::warning::FolkPatch: kpimg build failed (no aarch64 toolchain?), skipping prepatch"; exit 0; fi

          # Compiler for building KPMs against OUR KernelPatch ($KP) = best ABI
          # match to the kpimg just built. AOSP clang (the kernel's own) first,
          # cross-gcc as fallback.
          CL="$(find prebuilts*/clang/host/linux-x86 -maxdepth 2 -path '*/clang-r*/bin' -type d 2>/dev/null | sort -V | tail -n1 || true)"
          CLANG=""; [ -n "$CL" ] && [ -x "$PWD/$CL/clang" ] && CLANG="$PWD/$CL/clang"
          command -v aarch64-linux-gnu-gcc >/dev/null 2>&1 || sudo apt-get install -y gcc-aarch64-linux-gnu >/dev/null 2>&1 || true
          mkdir -p "$RUNNER_TEMP/kpms" "$GITHUB_WORKSPACE/folkpatch_companions"
          kpm_have() { ls "$RUNNER_TEMP/kpms/"*.kpm 2>/dev/null | grep -qiE "$1"; }

          # 0) Vendored KPMs are AUTHORITATIVE. Drop any .kpm into sources/kpms/ and
          #    it is embedded verbatim - the way to pin an exact version or a closed
          #    (EULA) module, e.g. your own selinux_magisk_access_filter v1.1.6.1.
          if ls "$GITHUB_WORKSPACE/sources/kpms/"*.kpm >/dev/null 2>&1; then
            cp "$GITHUB_WORKSPACE/sources/kpms/"*.kpm "$RUNNER_TEMP/kpms/"
            echo "[+] vendored KPMs: $(ls "$GITHUB_WORKSPACE/sources/kpms/"*.kpm | xargs -n1 basename | tr '\n' ' ')"
          fi

          # 1) NoMount (lzghzr/APatch_kpm) - mount-free VFS injection, no mount
          #    traces. Public dynamic/BTF prebuilt. Skipped if you vendored NoMount.
          if ! kpm_have 'nomount'; then
            gh release download --repo lzghzr/APatch_kpm --pattern 'NoMount.kpm' --dir "$RUNNER_TEMP/kpms" 2>/dev/null \
              && echo "[+] NoMount.kpm fetched" \
              || echo "::warning::FolkPatch: NoMount.kpm not fetched (lzghzr/APatch_kpm); vendor it under sources/kpms/"
          fi
          gh release download --repo lzghzr/APatch_kpm --pattern 'NoMount-kpm.zip' --dir "$GITHUB_WORKSPACE/folkpatch_companions" 2>/dev/null \
            || echo "::warning::FolkPatch: NoMount companion zip not fetched - grab it from lzghzr/APatch_kpm releases"

          # 2) Slot #2 hide KPM (BreZygisk-safe, NOT NoHello) - your hide_kpm choice.
          case "${{ inputs.hide_kpm }}" in
            xechide)
              # byBOOK10086/XEChide - kernel app hiding (LSM path + binder filter),
              # no userspace injection. Builds with Zig against our KP headers.
              XE="$RUNNER_TEMP/xechide"; rm -rf "$XE"
              if command -v zig >/dev/null 2>&1 && git clone --depth=1 https://github.com/byBOOK10086/XEChide "$XE" 2>/dev/null; then
                KP_SRC="$KP" bash "$XE/kpm/build.sh" >/dev/null 2>&1 && [ -f "$XE/kpm/out/xechide.kpm" ] \
                  && { cp "$XE/kpm/out/xechide.kpm" "$RUNNER_TEMP/kpms/"; echo "[+] xechide.kpm built"; } \
                  || echo "::warning::FolkPatch: XEChide build failed - vendor your xechide.kpm under sources/kpms/"
              else
                echo "::warning::FolkPatch: zig/XEChide unavailable - vendor your xechide.kpm under sources/kpms/"
              fi
              ;;
            hide_env)
              # klcok/kpm-hide-env - kernel root-environment hiding. gcc + our KP;
              # repo ships a prebuilt .kpm as an automatic fallback.
              HD="$RUNNER_TEMP/hide_env"; rm -rf "$HD"
              if git clone --depth=1 https://github.com/klcok/kpm-hide-env "$HD" 2>/dev/null; then
                make -C "$HD" TARGET_COMPILE=aarch64-linux-gnu- KP_DIR="$KP" >/dev/null 2>&1 || true
                HKPM="$(find "$HD" -maxdepth 1 -name 'hide_env*.kpm' 2>/dev/null | sort | head -n1 || true)"
                [ -n "$HKPM" ] && { cp "$HKPM" "$RUNNER_TEMP/kpms/hide_env.kpm"; echo "[+] hide_env.kpm ready"; } \
                  || echo "::warning::FolkPatch: hide_env KPM unavailable - vendor it under sources/kpms/"
                for z in "$HD"/hide_env-kpm.zip "$HD"/hide_env_v*.zip; do [ -f "$z" ] && { cp "$z" "$GITHUB_WORKSPACE/folkpatch_companions/"; break; }; done
              else
                echo "::warning::FolkPatch: kpm-hide-env clone failed - vendor hide_env.kpm under sources/kpms/"
              fi
              ;;
            *) echo "[i] slot #2 hide KPM: none" ;;
          esac

          # 3) selinux_magisk_access_filter (Admirepowered/selinux_hook) - rejects
          #    Magisk /sys/fs/selinux/access probes; in-kernel AVC untouched. GPL,
          #    built against OUR KP. Vendor your exact v1.1.6.1 to pin it instead.
          if ! kpm_have 'selinux'; then
            SH="$RUNNER_TEMP/selinux_hook"; rm -rf "$SH"
            if git clone --depth=1 https://github.com/Admirepowered/selinux_hook "$SH" 2>/dev/null; then
              BD="$SH"; [ -d "$SH/selinux_hook" ] && BD="$SH/selinux_hook"
              built=""
              if [ -n "$CLANG" ]; then make -C "$BD" CC="$CLANG --target=aarch64-linux-android33" KP_DIR="$KP" >/dev/null 2>&1 && built=1; fi
              [ -n "$built" ] || { make -C "$BD" TARGET_COMPILE=aarch64-linux-gnu- KP_DIR="$KP" >/dev/null 2>&1 && built=1; }
              shk="$(find "$BD" -maxdepth 1 -name '*.kpm' 2>/dev/null | head -n1 || true)"
              [ -n "$shk" ] && { cp "$shk" "$RUNNER_TEMP/kpms/selinux_magisk_access_filter.kpm"; echo "[+] selinux_magisk_access_filter.kpm built"; } \
                || echo "::warning::FolkPatch: selinux_hook build failed - vendor your selinux_magisk_access_filter.kpm under sources/kpms/"
            else
              echo "::warning::FolkPatch: selinux_hook clone failed - vendor selinux_magisk_access_filter.kpm under sources/kpms/"
            fi
          fi

          # 4) Optional: SUSFS-as-KPM (auto best-effort; only if vendored under
          #    sources/susfs-kpm - no published susfs .kpm exists).
          SKD="$GITHUB_WORKSPACE/sources/susfs-kpm"
          if [ -f "$SKD/Makefile" ]; then
            make -C "$SKD" TARGET_COMPILE=aarch64-linux-gnu- KP_DIR="$KP" >/dev/null 2>&1 \
              && find "$SKD" -name '*.kpm' -exec cp {} "$RUNNER_TEMP/kpms/" \; 2>/dev/null \
              && echo "[+] built SUSFS KPM" \
              || echo "::warning::FolkPatch: SUSFS KPM build failed"
          fi

          # Embed every KPM we gathered (auto-load at boot via kptools -M).
          KPM_ARGS=()
          while IFS= read -r kpm; do
            [ -n "$kpm" ] || continue
            nm="$(basename "$kpm" .kpm)"
            KPM_ARGS+=( -M "$kpm" -T kpm -N "$nm" -V load -A "" )
            echo "[+] embedding KPM: $nm"
          done < <(find "$RUNNER_TEMP/kpms" -type f -name '*.kpm' 2>/dev/null)
          [ "${#KPM_ARGS[@]}" -gt 0 ] || echo "::warning::FolkPatch: no KPMs embedded (all sources failed); baking root only"

          # Patch the Image in place (KernelPatch payload + superkey + KPMs), then
          # repackage AnyKernel3 as a second, clearly-named zip.
          if "$KPTOOLS" -p -i "$IMG" -S "$SKEY" -k "$KPIMG" "${KPM_ARGS[@]}" -o "$RUNNER_TEMP/Image.kp"; then
            cp "$RUNNER_TEMP/Image.kp" AnyKernel3/Image
            KVER_FULL="${{ steps.sync-kernel.outputs.resolved_kver }}"
            ZIP="$GITHUB_WORKSPACE/${KVER_FULL}-${{ matrix.kernel_version }}-FolkPatch-prepatched-AnyKernel3.zip"
            ( cd AnyKernel3 && zip -r9 "$ZIP" . )
            {
              echo "FolkPatch CI-prepatched kernel (@Dev_DcS)"
              echo "KernelPatch: LyraVoid/KernelPatch (built in CI)"
              echo "SuperKey: $SKEY"
              echo "Embedded KPMs: $(ls "$RUNNER_TEMP/kpms"/*.kpm 2>/dev/null | xargs -r -n1 basename | tr '\n' ' ')"
              echo "Also flash (folkpatch_companions/): $(ls "$GITHUB_WORKSPACE/folkpatch_companions" 2>/dev/null | tr '\n' ' ')"
              echo "NOTE: experimental - verify the FolkPatch app accepts this image; if boot fails, flash the stock zip and patch on-device instead. NoMount/hide_env also need their companion zip flashed to do anything."
            } > "$GITHUB_WORKSPACE/FolkPatch-prepatched.txt"
            echo "[+] FolkPatch-prepatched zip: $(basename "$ZIP")"
          else
            echo "::warning::FolkPatch: kptools patch failed (kpimg/ABI mismatch?); stock zip unaffected"
          fi

      - name: Upload FolkPatch-prepatched kernel
        if: ${{ inputs.ci_prepatch == 'true' && hashFiles('*-FolkPatch-prepatched-AnyKernel3.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.sync-kernel.outputs.resolved_kver }}-${{ matrix.kernel_version }}-FolkPatch-prepatched"
          path: |
            *-FolkPatch-prepatched-AnyKernel3.zip
            FolkPatch-prepatched.txt
            folkpatch_companions/*
