# @Dev_DcS - runtime concealment switches, read by apply-concealment.sh.
#
# Everything is commented out: install the companion and nothing changes until
# you uncomment a line. Two kinds:
#   key.path = value    sysctl, written to /proc/sys
#   prop name value     resetprop -n name value
#
# --- /proc/net/unix manager-socket hiding (proc-hide patch) ---------------
# Find the abstract name first:  cat /proc/net/unix | grep '@'
# then drop the leading '@' and put it here (comma-separated for several).
#net.hidden_socket_name = ksu_manager
#net.hide_manager_socket = 1
#
# --- bootloader lock props delivered via bootconfig (A13+ / Pixel) --------
# The kernel option (CONFIG_DEVDCS_BOOTSTATE_SPOOF) covers /proc/cmdline and
# any ro.boot.* that came from the command line; these cover the rest.
#prop ro.boot.verifiedbootstate green
#prop ro.boot.vbmeta.device_state locked
#prop ro.boot.flash.locked 1
#prop ro.boot.veritymode enforcing
#prop ro.boot.warranty_bit 0
#prop ro.warranty_bit 0
#prop ro.boot.verifiedbooterror
#prop vendor.boot.vbmeta.device_state locked
