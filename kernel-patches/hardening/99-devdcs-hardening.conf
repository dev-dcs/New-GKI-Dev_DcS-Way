# @Dev_DcS - runtime hardening sysctls. Safe on a rooted GKI phone:
# root, KernelSU, SUSFS, Zygisk and Frida all keep working.
#
# Apply with apply-hardening.sh from a module's post-fs-data.sh, or `sysctl -p`.
# Anything the running kernel doesn't support is skipped, never fatal.

# TOCTOU / symlink-swap protection in world-writable dirs (/tmp-style attacks).
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# No core dumps from suid/privileged processes.
fs.suid_dumpable = 0

# One-way latch: once set, no kexec of a replacement kernel until reboot.
kernel.kexec_load_disabled = 1

# Keep kernel pointers and logs away from unprivileged apps.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.perf_event_paranoid = 3

# Harden the BPF JIT against spray (this kernel force-enables the JIT).
net.core.bpf_jit_harden = 2

# Restrict ptrace to parent / CAP_SYS_PTRACE. Scope 1 still lets root, Zygisk
# and Frida attach - do NOT raise this to 2 or 3 on a hacking phone.
kernel.yama.ptrace_scope = 1
